name: CI stall diagnostic
on:
  push:
    branches:
      - maintenance/ci-stall-107-20260906
permissions:
  contents: read
concurrency:
  group: ci-stall-diagnostic
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive existing source history for offline analysis
        run: git bundle create repair-history.bundle --all
      - uses: actions/upload-artifact@v7
        with:
          name: ci-stall-repair-history
          path: repair-history.bundle
          if-no-files-found: error
          retention-days: 3
