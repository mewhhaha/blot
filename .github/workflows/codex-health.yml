name: Refresh language health artifacts

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/source-defined-include-transforms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/source-defined-include-transforms
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Refresh generated language-health outputs
        run: deno run --allow-read --allow-write scripts/generate_language_health.ts
      - name: Verify generated outputs
        run: deno run --allow-read scripts/generate_language_health.ts --check
      - name: Commit generated outputs and remove this one-shot workflow
        run: |
          rm .github/workflows/codex-health.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh generated language health"
          git push origin HEAD:codex/source-defined-include-transforms
