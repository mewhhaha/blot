name: do-blocks-full

on:
  push:
    branches:
      - agent/do-blocks-ci

permissions:
  contents: write

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare stacked diff and profile docs
        run: |
          git fetch origin simplify-handlers-and-if
          test "$(git merge-base HEAD origin/simplify-handlers-and-if)" = "$(git rev-parse origin/simplify-handlers-and-if)"
          git checkout origin/simplify-handlers-and-if -- src/check/mod.ts src/load.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/gpu-profile.md')
          text = p.read_text()
          replacements = {
              '| `lexerStates`               |               122 |': '| `lexerStates`               |               124 |',
              '| `islandCount`               |                86 |': '| `islandCount`               |                87 |',
              '| `islandStates`              |               505 |': '| `islandStates`              |               516 |',
              '| `islandTransitions`         |               519 |': '| `islandTransitions`         |               531 |',
              '| `denseTransitionBytes`      |           866,580 |': '| `denseTransitionBytes`      |           897,840 |',
              '| `packedBytes`               |           664,297 |': '| `packedBytes`               |           686,913 |',
              'Declaring all 86 rules as islands': 'Declaring all 87 rules as islands',
              'all 86\nrules still satisfy': 'all 87\nrules still satisfy',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing profile text: {old!r}')
              text = text.replace(old, new, 1)
          anchor = '''Declaring all 87 rules as islands is what preserves\nthe full CST shape needed by source lowering.\n'''
          note = '''\nAdding the explicit `do:` value scope adds two lexer states, one island, eleven\nisland states, twelve island transitions, 31,260 dense-transition bytes, and\n22,616 packed bytes relative to the parent profile. Candidate multiplicity,\ncontraction rounds, scratch factors, the root loop, and parallel long-region\nadmission are unchanged. `do_block` is retained as its own island and lowers to\nthe existing block AST. Removing the old parenthesized-suite inference happens\nin layout elaboration before parsing and therefore changes no parser counter.\n'''
          if anchor not in text:
              raise SystemExit('profile insertion anchor missing')
          text = text.replace(anchor, anchor + note, 1)
          p.write_text(text)
          PY
          deno fmt docs/gpu-profile.md
      - name: Rust target
        run: rustup target add wasm32-unknown-unknown
      - name: Generated Rust schema is current
        run: deno run --allow-read scripts/generate_rust_middle_schema.ts --check
      - name: Type check
        run: deno check mod.ts scripts/*.ts case-studies/*.ts experiments/generated-code/*.ts experiments/rust-middle/*.ts src/cli.ts src/backend/rust_middle.test.ts src/language_service.test.ts src/syntax/portable.test.ts src/syntax/surface.test.ts src/tooling/*.test.ts syntax.test.ts examples.test.ts inference.test.ts linear.test.ts comptime.test.ts module.test.ts backend.test.ts
      - name: Format check
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Corpus
        run: deno task corpus
      - name: Rust formatting
        run: |
          rustfmt --edition 2024 --check experiments/generated-code/counterpart.rs
          cargo fmt --manifest-path experiments/rust-middle/Cargo.toml --check
      - name: Rust clippy
        run: cargo clippy --manifest-path experiments/rust-middle/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path experiments/rust-middle/Cargo.toml
      - name: Rust middle artifact
        run: deno task check:rust-middle-artifact
      - name: Rust middle parity
        run: |
          deno task experiment:rust-middle-parity
          deno task experiment:rust-middle-check-parity
          deno task experiment:rust-middle-eval-parity
          deno task experiment:rust-middle-hir-parity
      - name: Rust compiler verification
        run: deno task verify:rust-compiler
      - name: Full Deno tests
        run: deno test --allow-read --allow-write
      - name: Confirm parser profile
        run: |
          deno task inspect | tee /tmp/profile.txt
          grep -q '"lexerStates": 124' /tmp/profile.txt
          grep -q '"islandCount": 87' /tmp/profile.txt
          grep -q '"islandStates": 516' /tmp/profile.txt
          grep -q '"islandTransitions": 531' /tmp/profile.txt
          grep -q '"denseTransitionBytes": 897840' /tmp/profile.txt
          grep -q '"packedBytes": 686913' /tmp/profile.txt
      - name: Commit cleanup and profile docs
        run: |
          git config user.name "Jacob Torrång"
          git config user.email "kopatheonlyone@hotmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: record do block parser profile"
            git push origin HEAD:do-blocks
          fi
