name: Unified CI lint repair

on:
  push:
    branches:
      - codex/unify-operator-language-review
    paths:
      - .github/workflows/unify-ci-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'mewhhaha/blot' && github.ref == 'refs/heads/codex/unify-operator-language-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Repair known Clippy failure and remove helper workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('compiler/src/typecheck.rs')
          source = path.read_text()
          old = 'member_constraints::map_type_children(qualified, |child| stable_loop_signature(child))'
          new = 'member_constraints::map_type_children(qualified, stable_loop_signature)'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one redundant closure, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git rm .github/workflows/unify-ci-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler/src/typecheck.rs
          git commit -m 'Fix qualified loop signature lint'
          git push origin HEAD:refs/heads/codex/unify-operator-language-review
