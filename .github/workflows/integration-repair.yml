name: Apply reviewed integration repairs
on:
  push:
    branches: [integrate/operator-dispatch-language-review]
    paths: [.github/workflows/integration-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'mewhhaha/blot' && github.ref == 'refs/heads/integrate/operator-dispatch-language-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Apply reviewed replacements and verify exact tested outputs
        env:
          PATCH_BASE: d2037aea37e94366e7a8ec9d3443c7c6c0f0a0c0
        run: |
          test "$(git rev-parse HEAD^)" = "$PATCH_BASE"
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, re
          def replace(path, old, new):
              file = Path(path)
              source = file.read_text()
              assert source.count(old) == 1, path
              file.write_text(source.replace(old, new))
          replace('compiler/src/typecheck.rs',
              'member_constraints::map_type_children(qualified, |child| stable_loop_signature(child))',
              'member_constraints::map_type_children(qualified, stable_loop_signature)')
          for path, message in [
              ('compiler/src/eval.rs', 'an unsupported projection must return a diagnostic'),
              ('compiler/src/member_constraint_tests.rs', 'discarding the result must not discard requirements'),
          ]:
              file = Path(path)
              source, count = re.subn(r'\.err\(\)\s*\.expect\("' + re.escape(message) + r'"\)', '.expect_err("' + message + '")', file.read_text())
              assert count == 1, path
              file.write_text(source)
          replace('formal/lean/Blot/QCore.lean',
              '            | .StructuralRange _ _ _ | .StructuralUnit => true',
              '            | .StructuralQualified body names subjects members =>\n'
              '                decide (names.length = subjects.length) &&\n'
              '                decide (names.length = members.length) &&\n'
              '                scopedValue arena remaining depth rigids body &&\n'
              '                subjects.all (scopedValue arena remaining depth rigids) &&\n'
              '                members.all (scopedValue arena remaining depth rigids)\n'
              '            | .StructuralRange _ _ _ | .StructuralUnit => true')
          for path in ['src/tooling/control_flow.ts', 'src/tooling/control_flow.test.ts']:
              replace(path, '**return** — supplies the result of this module.', '**return** — supplies the result of the nearest module (this module).')
          replace('src/language_service.test.ts', '"`Int.negate`"', '"`Op.negate`"')
          file = Path('docs/language-claims.json')
          document = json.loads(file.read_text())
          claims = [claim for claim in document['claims'] if claim['id'] == 'named-equality-defaults-to-int']
          assert len(claims) == 1
          claim = claims[0]
          assert claim['status'] == 'current-limit' and claim['code'] == 'BLOT_TYPE_ERROR'
          claim['id'] = 'named-equality-retains-generic-members'
          claim['status'] = 'accepted'
          del claim['code']
          claim['display'] = 'true'
          file.write_text(json.dumps(document, indent=2, ensure_ascii=False) + '\n')
          expected = {
              'compiler/src/typecheck.rs': 'a27d4c03d2bac462788e03dae0c0d7b4bf36cef4f759e17ade8969287197fae2',
              'compiler/src/eval.rs': '3e04cd37f05b06e52237ed6e69ab173ff06ded525affc8f03994345829762912',
              'compiler/src/member_constraint_tests.rs': '09865929790ac7af418c5c1771bc067b1c1af0b391e890b5766e9ad932a04c30',
              'formal/lean/Blot/QCore.lean': 'bfd74d21242c73214bcea6f6739f2017970437383ea60924f95da3853ba47b22',
              'src/tooling/control_flow.ts': 'df5e9347ab1ac5389c452ae94cf7ff97d2b397c50093c3feb0c35e5c317f1423',
              'src/tooling/control_flow.test.ts': '0bda5b48e7ad632de785ee46b0c47aaaa0aa1fa7db729b1cf59bfe33ce70f0db',
              'src/language_service.test.ts': '18a02da5529256639a885b655d719e7ce22b8baf38cce15f2fd37ed7c80a70a8',
              'docs/language-claims.json': '00ef4f0a66a551b5f95ff68cf55b38afa063094a5c8888e38f30dca9c860db16',
          }
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          PYCODE
          git diff --check
          git rm .github/workflows/integration-repair.yml
          git add compiler/src/typecheck.rs compiler/src/eval.rs compiler/src/member_constraint_tests.rs formal/lean/Blot/QCore.lean src/tooling/control_flow.ts src/tooling/control_flow.test.ts src/language_service.test.ts docs/language-claims.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Reconcile integrated hover, equality evidence, Rust lint, and QCore scope checks"
          git push origin HEAD:refs/heads/integrate/operator-dispatch-language-review
