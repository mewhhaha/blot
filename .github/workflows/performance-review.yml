name: Compiler performance review workspace

on:
  push:
    branches:
      - perf/compiler-runtime-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive exact review inputs
        run: git archive --format=tar.gz --output=blot-review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: blot-review-source
          path: blot-review-source.tar.gz
          if-no-files-found: error
          retention-days: 7
