name: Pre-qualified operator diagnostics

on:
  push:
    branches:
      - diagnostics/operator-pre-qualified

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Restore broad-domain constraints for inferred operator members
        run: >-
          python3 -c "from pathlib import Path; p=Path('compiler/src/typecheck.rs'); s=p.read_text(); old='                    let is_resolve_op = static_member(&target_value, name)\\n                        .as_ref()\\n                        .is_some_and(|val| is_operator_member_closure(&self.context, val));\\n                    let parameter_type = if is_resolve_op {'; block='                    let is_resolve_op = static_member(&target_value, name)\\n                        .as_ref()\\n                        .is_some_and(|val| is_operator_member_closure(&self.context, val));\\n                    if is_resolve_op && arguments.len() >= 2 {\\n                        let domain = self.resolve_operand_domain(&arguments[0], &arguments[1]);\\n                        if let Some(domain) = domain {\\n                            let span = module.arena.expression_span(expression_id);\\n                            match domain {\\n                                Domain::Int => {\\n                                    let int = int_type();\\n                                    self.constrain(arguments[0].clone(), int.clone(), span)?;\\n                                    self.constrain(arguments[1].clone(), int, span)?;\\n                                }\\n                                Domain::Text => {\\n                                    let text = text_type();\\n                                    self.constrain(arguments[0].clone(), text.clone(), span)?;\\n                                    self.constrain(arguments[1].clone(), text, span)?;\\n                                }\\n                                Domain::Float => {\\n                                    if name != \"eq\" && name != \"ne\" {\\n                                        let float = float_type();\\n                                        self.constrain(arguments[0].clone(), float.clone(), span)?;\\n                                        self.constrain(arguments[1].clone(), float, span)?;\\n                                    }\\n                                }\\n                                Domain::Float32 => {\\n                                    if name != \"eq\" && name != \"ne\" {\\n                                        let f32_ = float32_type();\\n                                        self.constrain(arguments[0].clone(), f32_.clone(), span)?;\\n                                        self.constrain(arguments[1].clone(), f32_, span)?;\\n                                    }\\n                                }\\n                            }\\n                        }\\n                    }\\n                    let parameter_type = if is_resolve_op {'; assert s.count(old)>=1, s.count(old); p.write_text(s.replace(old,block,1))"
          && cargo fmt --manifest-path compiler/Cargo.toml
          && git diff --check
      - name: Loop inference regressions
        shell: bash
        run: |
          timeout 120 cargo test --manifest-path compiler/Cargo.toml a_rebound_loop_element_stays_local_to_each_iteration -- --nocapture
          timeout 120 cargo test --manifest-path compiler/Cargo.toml a_conditionally_rebound_loop_element_stays_local_to_each_iteration -- --nocapture
      - name: Operator dispatch tests
        run: timeout 180 cargo test --manifest-path compiler/Cargo.toml operator_dispatch_tests -- --nocapture
      - name: Full Rust suite serially
        run: timeout 360 cargo test --manifest-path compiler/Cargo.toml -- --test-threads=1 --nocapture
