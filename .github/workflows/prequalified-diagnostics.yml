name: Pre-qualified operator diagnostics

on:
  push:
    branches:
      - diagnostics/operator-pre-qualified

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Apply resolver-only operator widening
        run: python3 scripts/diag_operator_widen.py && cargo fmt --manifest-path compiler/Cargo.toml && git diff --check
      - name: Loop inference regressions
        shell: bash
        run: |
          timeout 120 cargo test --manifest-path compiler/Cargo.toml a_rebound_loop_element_stays_local_to_each_iteration -- --nocapture
          timeout 120 cargo test --manifest-path compiler/Cargo.toml a_conditionally_rebound_loop_element_stays_local_to_each_iteration -- --nocapture
      - name: Operator dispatch tests
        run: timeout 180 cargo test --manifest-path compiler/Cargo.toml operator_dispatch_tests -- --nocapture
      - name: Full Rust suite serially
        run: timeout 360 cargo test --manifest-path compiler/Cargo.toml -- --test-threads=1 --nocapture
