name: Integration validation tools

on:
  push:
    branches: [codex/unify-operator-language-review-20260905]
    paths: [.github/workflows/integration-snapshot.yml]

permissions:
  contents: read

jobs:
  tools:
    if: github.repository == 'mewhhaha/blot' && github.ref == 'refs/heads/codex/unify-operator-language-review-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Package compiler tools without repository credentials
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/integration-tools"
          sysroot="$(rustc --print sysroot)"
          mkdir -p "$destination/bin" "$destination/lib/rustlib"
          cp "$(command -v deno)" "$destination/bin/deno"
          cp "$sysroot/bin/cargo-clippy" "$sysroot/bin/clippy-driver" "$sysroot/bin/cargo-fmt" "$destination/bin/"
          cp -a "$sysroot/lib/rustlib/wasm32-unknown-unknown" "$destination/lib/rustlib/"
          tar -czf "$RUNNER_TEMP/integration-tools.tar.gz" -C "$destination" .
      - uses: actions/upload-artifact@v7
        with:
          name: integration-validation-tools
          path: ${{ runner.temp }}/integration-tools.tar.gz
          retention-days: 1
