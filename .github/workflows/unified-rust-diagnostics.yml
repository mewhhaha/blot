name: Unified Rust diagnostics

on:
  push:
    branches:
      - diagnostics/unified-rust-tests

permissions:
  contents: read

jobs:
  serial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Full Rust suite serially with progress
        run: timeout 420 cargo test --manifest-path compiler/Cargo.toml -- --test-threads=1 --nocapture
