name: PR94 qualified lowering debug

on:
  push:
    branches:
      - debug/pr94-qualified-lowering

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Instrument failed residual signature reification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('compiler/src/typecheck.rs')
          source = path.read_text()
          marker = 'fn reify_type_with_holes(context: &Context, type_: &Type, next_hole: &mut u32) -> Option<Value> {'
          prefix, tail = source.split(marker, 1)
          needle = '        Type::Range { domain, low, high } => {\n'
          tail = tail.replace(needle, '        Type::Qualified { body, .. } => reify_type_with_holes(context, body, next_hole),\n' + needle, 1)
          source = prefix + marker + tail
          needle2 = '            let inferred_signature = self.reify_runtime_type(&settled_signature);\n'
          replacement2 = needle2 + '            if inferred_signature.is_none() {\n                eprintln!("UNREIFIED_RESIDUAL_SIGNATURE: {settled_signature:#?}");\n            }\n'
          if source.count(needle2) != 1:
              raise SystemExit(f'expected one inferred signature site, found {source.count(needle2)}')
          path.write_text(source.replace(needle2, replacement2, 1))
          PY
          cargo fmt --manifest-path compiler/Cargo.toml
      - name: Run one failing regression
        shell: bash
        run: timeout 90s cargo test --manifest-path compiler/Cargo.toml an_empty_scratch_argument_uses_the_contextual_result_representation -- --nocapture --test-threads=1
