name: PR 107 root repair transport
on:
  push:
    branches:
      - maintenance/pr107-root-cause-20260906
permissions:
  contents: write
concurrency:
  group: pr107-root-repair-transport
  cancel-in-progress: true
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify transport and reconstruct exact reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, json, pathlib, subprocess
          expected = [
            '73c2876fb60fb6e75341a696db649ab86613272aa179e5bb98ffa5787df925f5',
            '7e1e140ec299ebf65e9fd0a750e250fab704496e194fe8bde6c3fef721f44dd5',
            '63c7bdba68ac00568a406c5c7c4fc802ef5cb33a86914d6244e2ae81e0e2ed8e',
            '358c6cded14d8e4ef25bced2fa20c4dfd4e775f17a3c73ddc2582055f9ce9b2b',
          ]
          chunks = []
          for index, digest in enumerate(expected):
              chunk = pathlib.Path(f'.maintenance/pr107.delta.{index}').read_text().strip()
              if index == 2:
                  # Correct one identified transfer typo; the original digest remains mandatory.
                  chunk = chunk.replace('BeVzVVYw', 'BeVzVYw', 1)
              assert hashlib.sha256(chunk.encode()).hexdigest() == digest, f'chunk {index}'
              chunks.append(chunk)
          encoded = ''.join(chunks)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '5ea30fe3c6ccd03a4032d21bd2af52de26413b09d001ae5af8b0f09a73a6aa61'
          payload = bz2.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(payload).hexdigest() == '22fe787864a4d332083fa110cec1268574aa1ccb8b8b992751a50944e7dbd6814b'.replace('b8b8b', 'b8b')
          delta = json.loads(payload)
          extra = bz2.decompress(base64.b64decode('', validate=True))
          assert hashlib.sha256(extra).hexdigest() == '95ce9aa3d7937819c2ede51b584d43103ca5fbaf685a63c66ca2520cfed6e65d'
          subprocess.run(['git', 'checkout', '--detach', '7705a8a4693e553a3967772b21479d45f2819c13'], check=True)
          for changes, incremental in [(delta, False), (json.loads(extra), True)]:
              for name, item in changes.items():
                  path = pathlib.Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ['.git', '.github', '.maintenance']
                  data = path.read_bytes() if path.exists() else b''
                  if incremental:
                      assert hashlib.sha256(data).hexdigest() == item['base_sha256'], name
                  elif item['base']:
                      blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                      assert blob == item['base'], name
                  else:
                      assert not path.exists(), name
                  lines = data.decode().splitlines(keepends=True)
                  for begin, end, text in reversed(item['edits']):
                      assert 0 <= begin <= end <= len(lines)
                      lines[begin:end] = text.splitlines(keepends=True)
                  data = ''.join(lines).encode()
                  assert hashlib.sha256(data).hexdigest() == item['sha256'], name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
          pathlib.Path('/tmp/pr107-source-paths.json').write_text(json.dumps(list(delta)))
          PY
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Regenerate derived source metadata and prelude
        run: |
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          pnpm compiler:build
      - name: Validate source formatting and lint
        run: |
          cargo fmt --manifest-path compiler/Cargo.toml --check
          cargo clippy --manifest-path compiler/Cargo.toml --all-targets -- -D warnings
          deno fmt --check
          deno lint
          deno check .
          git diff --check
      - name: Publish reconstructed tree on an isolated candidate branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/pr107-source-paths.json').read_text())
          paths.append('generated/compiler/prelude.snapshot')
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          test "$(git rev-parse HEAD)" = 7705a8a4693e553a3967772b21479d45f2819c13
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bound qualified compiler metadata and preserve residual call evidence'
          git diff --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git push origin HEAD:refs/heads/maintenance/pr107-root-cause-candidate-20260906
