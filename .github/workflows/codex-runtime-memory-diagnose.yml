name: Codex runtime memory diagnosis

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect-sum-callers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print residual sum_type callers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("compiler/src/hir.rs").read_text().splitlines()
          centers = [
              index
              for index, line in enumerate(lines)
              if "sum_type(" in line and "fn sum_type" not in line
          ]
          for center in centers:
              start = max(0, center - 12)
              end = min(len(lines), center + 16)
              print(f"\n===== compiler/src/hir.rs:{start + 1}-{end} =====")
              for index in range(start, end):
                  print(f"{index + 1:05d}: {lines[index]}")
          PY
