name: Codex runtime memory diagnosis

on:
  pull_request:

permissions:
  contents: read

jobs:
  take-at-shape:
    name: take_at ${{ matrix.shape }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shape:
          - array_then_option
          - flagged_tuple
          - sentinel_tuple
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Replace take_at with candidate representation
        env:
          SHAPE: ${{ matrix.shape }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          candidates = {
              "array_then_option": "let take_at :: ([Int], Int) -> ([Int], Option Int)\nlet take_at = fn (values, index) => do:\n  if index >= 0 && index < Array.length (&values):\n    let (selected, remainder) = @array.take values index\n    return (remainder, Some selected)\n\n  return (values, None)\n",
              "flagged_tuple": "let take_at :: ([Int], Int) -> (Bool, Int, [Int])\nlet take_at = fn (values, index) => do:\n  if index >= 0 && index < Array.length (&values):\n    let (selected, remainder) = @array.take values index\n    return (True, selected, remainder)\n\n  return (False, 0, values)\n",
              "sentinel_tuple": "let take_at :: ([Int], Int) -> (Int, [Int])\nlet take_at = fn (values, index) => do:\n  if index >= 0 && index < Array.length (&values):\n    return @array.take values index\n\n  return (0, values)\n",
          }

          fixture = Path("examples/runtime_memory_lowerings.blot")
          source = fixture.read_text()
          source, count = re.subn(
              r"let take_at :: \(\[Int\], Int\) -> Option \(Int, \[Int\]\)\n"
              r"let take_at = fn \(values, index\) => do:\n"
              r"  if index >= 0 && index < Array.length \(&values\):\n"
              r"    return Some \(@array.take values index\)\n\n"
              r"  return None\n",
              candidates[os.environ["SHAPE"]],
              source,
          )
          assert count == 1, "could not replace take_at"
          source, count = re.subn(
              r"return \{\n(?:  \.[^\n]+\n)+\}\n\Z",
              "return {\n  .take_at = take_at;\n}\n",
              source,
          )
          assert count == 1, "could not isolate take_at export"
          fixture.write_text(source)

          session = Path("compiler/src/session.rs")
          source = session.read_text()
          start = source.index(
              "    fn runtime_memory_lowering_fixture_prepares_and_emits_all_builders()"
          )
          end = source.index(
              "\n    #[test]\n    fn runtime_text_replace_emits_its_single_join()",
              start,
          )
          test = source[start:end]
          assertion = '            assert_eq!(prepared["ok"], true, "{prepared}");'
          keep = test.index(assertion) + len(assertion)
          test = test[:keep] + "\n        });\n    }\n"
          session.write_text(source[:start] + test + source[end:])
          PY
      - name: Prepare candidate
        run: cargo test --manifest-path compiler/Cargo.toml runtime_memory_lowering_fixture_prepares_and_emits_all_builders -- --nocapture
