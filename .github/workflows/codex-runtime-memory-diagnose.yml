name: Codex runtime memory diagnosis

on:
  pull_request:

permissions:
  contents: read

jobs:
  take-at-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Isolate take_at and expose runtime layouts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          fixture = Path("examples/runtime_memory_lowerings.blot")
          source = fixture.read_text()
          source, count = re.subn(
              r"return \{\n(?:  \.[^\n]+\n)+\}\n\Z",
              "return {\n  .take_at = take_at;\n}\n",
              source,
          )
          assert count == 1, "could not isolate take_at export"
          fixture.write_text(source)

          session = Path("compiler/src/session.rs")
          source = session.read_text()
          start = source.index(
              "    fn runtime_memory_lowering_fixture_prepares_and_emits_all_builders()"
          )
          end = source.index(
              "\n    #[test]\n    fn runtime_text_replace_emits_its_single_join()",
              start,
          )
          test = source[start:end]
          assertion = '            assert_eq!(prepared["ok"], true, "{prepared}");'
          keep = test.index(assertion) + len(assertion)
          test = test[:keep] + "\n        });\n    }\n"
          session.write_text(source[:start] + test + source[end:])

          hir = Path("compiler/src/hir.rs")
          source = hir.read_text()
          pattern = re.compile(
              r'        if result\.type_id != expected \{\n'
              r'            return Err\(hir_error\(\n'
              r'                "A function export result does not match its checked type\.",\n'
              r'            \)\);\n'
              r'        \}\n'
          )
          replacement = (
              '        if result.type_id != expected {\n'
              '            let actual_type = serde_json::to_string(&self.types[result.type_id])\n'
              '                .unwrap_or_else(|_| format!("type {}", result.type_id));\n'
              '            let expected_type = serde_json::to_string(&self.types[expected])\n'
              '                .unwrap_or_else(|_| format!("type {expected}"));\n'
              '            return Err(hir_error(&format!(\n'
              '                "A function export result does not match its checked type: actual {} = {actual_type}; expected {expected} = {expected_type}.",\n'
              '                result.type_id,\n'
              '            )));\n'
              '        }\n'
          )
          source, count = pattern.subn(replacement, source, count=1)
          assert count == 1, "could not instrument function export layout check"
          hir.write_text(source)
          PY
      - name: Prepare take_at
        run: cargo test --manifest-path compiler/Cargo.toml runtime_memory_lowering_fixture_prepares_and_emits_all_builders -- --nocapture
