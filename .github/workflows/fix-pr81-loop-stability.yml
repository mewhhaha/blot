name: Validate PR 81 loop stability fix

on:
  push:
    branches:
      - fix/stable-rebinding-context

permissions:
  contents: write

concurrency:
  group: pr81-loop-stability
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-rebinding-context
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply narrower loop-lineage fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("compiler/src/typecheck.rs")
          text = path.read_text(encoding="utf-8")

          old = '''                let names = pattern_names(module, pattern);
                let recursive_name = recursive.then(|| {
'''
          new = '''                let names = pattern_names(module, pattern);
                let loop_stable_names = if matches!(
                    &module.arena.expressions[value.0 as usize],
                    Expression::Var { name, .. } if name == "loop$"
                ) {
                    names
                        .iter()
                        .filter_map(|name| {
                            let typing = types.lookup_stable(name, self)?;
                            let type_ = match &typing {
                                Typing::Mono(type_) => type_,
                                Typing::Scheme { body, .. } => body,
                            };
                            match self.settle(type_.clone(), true) {
                                Type::Variant { cases, open: false } if cases.len() > 1 => {
                                    Some((name.clone(), typing))
                                }
                                _ => None,
                            }
                        })
                        .collect::<Vec<_>>()
                } else {
                    Vec::new()
                };
                let recursive_name = recursive.then(|| {
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one names insertion site, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''                let synthetic_loop = recursive
                    && names.len() == 1
                    && names[0] == "go$"
                    && module.arena.synthetic_expressions.contains(&value);
                let generalized = !synthetic_loop
                    && kind != DeclarationKind::Effect
                    && names
                        .iter()
                        .all(|name| !name.starts_with(FIXITY_INTERMEDIATE_PREFIX));
'''
          new = '''                let generalized = kind != DeclarationKind::Effect
                    && names
                        .iter()
                        .all(|name| !name.starts_with(FIXITY_INTERMEDIATE_PREFIX));
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one synthetic-loop generalization site, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''                self.bind_pattern(module, pattern, inferred.type_.clone(), types);
                if let Pattern::Name { name, .. } = &module.arena.patterns[pattern.0 as usize] {
'''
          new = '''                self.bind_pattern(module, pattern, inferred.type_.clone(), types);
                for (name, typing) in loop_stable_names {
                    Rc::make_mut(&mut types.stable_names).insert(name, typing);
                }
                if let Pattern::Name { name, .. } = &module.arena.patterns[pattern.0 as usize] {
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one bind-pattern insertion site, found {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("docs/inference.md")
          text = path.read_text(encoding="utf-8")
          old = '''A lowered `for` keeps its generated recursive accumulator monomorphic. The first
call therefore contributes the enclosing bindings' stable types to the same
inference variables used by every back edge, instead of generalizing a loop body
from a narrower replacement before the initial state is seen.
'''
          new = '''A lowered `for` keeps an already-wider closed constructor type from the source
binding as stable-lineage context when it destructures the accumulator. The
recursive accumulator itself remains inferred normally. This distinction keeps
an explicitly `Bool` binding Boolean while allowing an unannotated `#False`
accumulator to widen from the values produced by its back edges.
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one inference-doc loop paragraph, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("spec/TYPECHECKING.md")
          text = path.read_text(encoding="utf-8")
          old = '''Stable rebinding checks its replacement against the binding lineage's existing
type and retains that existing type in the environment. This is subsumption, not
symmetric unification: a constructor such as `#True` may inhabit the stable
`#True | #False` type without narrowing the lineage. Lowered `for` recursion is
monomorphic so its initial accumulator and every back edge constrain one shared
type graph; generalizing the generated recursive function before its initial
call would lose that context and incorrectly narrow the accumulator to a single
replacement.
'''
          new = '''Stable rebinding checks its replacement against the binding lineage's existing
type and retains that existing type in the environment. This is subsumption, not
symmetric unification: a constructor such as `#True` may inhabit the stable
`#True | #False` type without narrowing the lineage. When `for` lowering
introduces its unspellable `loop$` accumulator binding, a closed
multi-constructor variant already established for a carried source name is
retained separately as that name's stable lineage. The generated recursion is
otherwise inferred normally, so an unannotated singleton accumulator may still
widen from its recursive back edges.
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one typechecking-spec paragraph, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cargo fmt --manifest-path compiler/Cargo.toml
          git diff --check
          deno run --allow-read --allow-write scripts/generate_language_health.ts

      - name: Test stable Bool rebinding regression
        run: >-
          cargo test --manifest-path compiler/Cargo.toml
          session::tests::stable_rebinding_preserves_a_declared_variant_inside_a_loop
          -- --exact --nocapture

      - name: Test engine loop lowering regression
        run: >-
          cargo test --manifest-path compiler/Cargo.toml
          session::tests::engine_entry_points_prepare_and_the_game_loop_emits_wasm
          -- --exact --nocapture

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-pr81-loop-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve stable loop lineage without narrowing accumulators"
          git push origin HEAD:fix/stable-rebinding-context
