name: Validate PR 81 loop stability fix

on:
  push:
    branches:
      - fix/stable-rebinding-context

permissions:
  contents: write

concurrency:
  group: pr81-loop-stability
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-rebinding-context
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply narrower loop-lineage fix
        run: |
          python .github/fix-pr81-loop-stability.py
          cargo fmt --manifest-path compiler/Cargo.toml
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("generated/language-health.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          counts = {
              "compiler/src/typecheck.rs": len(Path("compiler/src/typecheck.rs").read_text(encoding="utf-8").splitlines()),
              "compiler/src/session.rs": len(Path("compiler/src/session.rs").read_text(encoding="utf-8").splitlines()),
          }
          for hotspot in data.get("hotspots", []):
              if hotspot.get("path") in counts:
                  hotspot["lines"] = counts[hotspot["path"]]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Test stable Bool rebinding regression
        run: >-
          cargo test --manifest-path compiler/Cargo.toml
          session::tests::stable_rebinding_preserves_a_declared_variant_inside_a_loop
          -- --exact --nocapture

      - name: Test engine loop lowering regression
        run: >-
          cargo test --manifest-path compiler/Cargo.toml
          session::tests::engine_entry_points_prepare_and_the_game_loop_emits_wasm
          -- --exact --nocapture

      - name: Commit validated fix
        run: |
          rm .github/fix-pr81-loop-stability.py
          rm .github/workflows/fix-pr81-loop-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve stable loop lineage without narrowing accumulators"
          git push origin HEAD:fix/stable-rebinding-context
