name: Finalize performance evidence
on:
  push:
    branches: [validation/performance-pathologies-20260906]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select tested clean branch
        run: |
          cp .validation/before.json "$RUNNER_TEMP/before.json"
          cp .validation/after.json "$RUNNER_TEMP/after.json"
          git switch perf/linear-layout-text-search-20260906
          test "$(git rev-parse HEAD)" = e6b9dd6c09ab4022506944adff3e19aac581fc93
          mkdir -p experiments/performance-pathologies/results
          cp "$RUNNER_TEMP/before.json" experiments/performance-pathologies/results/before.json
          cp "$RUNNER_TEMP/after.json" experiments/performance-pathologies/results/after.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Refresh generated health and document observations
        run: |
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          cat >> experiments/performance-pathologies/README.md <<'EOF'

          ## Recorded comparison

          The checked-in [before](results/before.json) and [after](results/after.json)
          samples were recorded on September 6, 2026, on the same Linux x64 host,
          Intel Xeon Platinum 8370C, Node 22.16.0 / V8 12.4.254.21-node.26. Both
          compiler artifacts were rebuilt with Rust 1.97.1 in production mode. The
          baseline artifact's commit is `2453ecb`, which adds only an isolated
          validation workflow to main `55f02bc`; the candidate is `e6b9dd6`.
          The reports retain exact compiler/input digests and workload source hashes.

          ```sh
          node --import tsx experiments/performance-pathologies/benchmark.ts \
            --depths=10,12,14 --sizes=32768 --samples=3
          ```

          | Workload | Before median (ms) | After median (ms) |
          | --- | ---: | ---: |
          | Compile depth-10 record | 48.417 | 24.499 |
          | Compile depth-12 record | 276.573 | 30.674 |
          | Compile depth-14 record | 2331.645 | 30.940 |
          | Contains, 32768-byte text / 4097-byte late-mismatch query | 88.121 | 0.052 |
          | Find from scalar zero, same inputs | 85.467 | 0.052 |

          These are medians of three raw samples, not confidence intervals or CI
          thresholds. JIT warmup and shared-host noise remain visible in the reports.
          Both record leaves and every search result were checked; record output
          sizes are unchanged. These targeted results do not predict speedups for
          unrelated programs or eliminate other compiler/runtime pathologies.
          EOF
          deno fmt generated/language-health.json experiments/performance-pathologies
          deno run --allow-read scripts/generate_language_health.ts --check
          deno fmt --check generated/language-health.json experiments/performance-pathologies src/node/performance_pathologies.test.ts spec/COST_MODEL.md
          deno lint experiments/performance-pathologies/*.ts src/node/performance_pathologies.test.ts
          pnpm current:check
      - name: Publish evidence without changing tested compiler sources
        run: |
          git add generated/language-health.json experiments/performance-pathologies
          git diff --cached --check
          git diff --exit-code -- compiler src generated/compiler
          git config user.name 'Blot performance review'
          git config user.email 'performance@users.noreply.github.com'
          git commit -m 'Record before-after evidence and refresh generated language health'
          git push origin HEAD:refs/heads/perf/linear-layout-text-search-20260906
