name: Isolated performance payload verification
on:
  push:
    branches: [validation/performance-pathologies-20260906]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v7
        with:
          name: transported-payload
          path: .validation/candidate.patch.gz
          retention-days: 1
      - name: Verify compressed transport
        run: gzip -t .validation/candidate.patch.gz
