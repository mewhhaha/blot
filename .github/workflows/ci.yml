name: Apply V8 branch-hint target patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/v8-wasm3-branch-hints
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Apply and validate the target patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v8_branch_hints.py
          cargo fmt --manifest-path compiler/Cargo.toml
          deno fmt \
            docs/abi.md \
            docs/v8-wasm3-feature-audit.md \
            docs/wasm-target-profile.md \
            spec/RUNTIME.md \
            src/node/v8_wasm.test.ts
          cargo test --manifest-path compiler/Cargo.toml
          cargo check \
            --manifest-path compiler/Cargo.toml \
            --target wasm32-unknown-unknown
      - name: Publish the clean review branch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm scripts/apply_v8_branch_hints.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Emit Wasm 3 branch hints for V8 cold paths"
          git push origin HEAD:codex/v8-wasm3-branch-hints
