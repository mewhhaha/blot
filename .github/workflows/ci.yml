name: Generate V8 target health artifacts

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Regenerate deterministic health outputs
        run: deno run --allow-read --allow-write scripts/generate_language_health.ts
      - name: Upload generated outputs
        uses: actions/upload-artifact@v7
        with:
          name: v8-target-health
          path: |
            generated/language-health.json
            src/diagnostic_codes.generated.ts
            STDLIB.md
          if-no-files-found: error
          retention-days: 1
