name: Rust/Wasm compiler CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-tail-forwarding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/v8-wasm3-target
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Patch, validate, and commit the forwarding-tail analysis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one occurrence, found {count}: {old[:100]!r}"
                  )
              file.write_text(text.replace(old, new))

          backend_path = Path("compiler/src/backend.rs")
          backend = backend_path.read_text()
          helper_pattern = re.compile(
              r'''fn direct_tail_call\(block: &RuntimeBlock\) -> Option<&RuntimeOperation> \{\n.*?\n\}\n\nfn runtime_type_uses_simd''',
              re.DOTALL,
          )
          helper = '''fn direct_tail_call<'a>(
              function: &'a RuntimeFunction,
              block: &'a RuntimeBlock,
          ) -> Option<&'a RuntimeOperation> {
              let operation = block.operations.last()?;
              if operation.kind != "call.direct" {
                  return None;
              }
              forwards_to_return(
                  function,
                  &block.terminator,
                  operation.result,
                  &mut HashSet::new(),
              )
              .then_some(operation)
          }

          fn forwards_to_return(
              function: &RuntimeFunction,
              terminator: &RuntimeTerminator,
              value: usize,
              visited: &mut HashSet<usize>,
          ) -> bool {
              match terminator {
                  RuntimeTerminator::Return {
                      value: returned, ..
                  } => *returned == value,
                  RuntimeTerminator::Branch {
                      target, arguments, ..
                  } => {
                      if !visited.insert(*target) {
                          return false;
                      }
                      let Some(block) = function.blocks.get(*target) else {
                          return false;
                      };
                      if block.id != *target || !block.operations.is_empty() {
                          return false;
                      }
                      block
                          .parameters
                          .iter()
                          .zip(arguments)
                          .filter(|(_, argument)| **argument == value)
                          .any(|(parameter, _)| {
                              let mut path = visited.clone();
                              forwards_to_return(
                                  function,
                                  &block.terminator,
                                  parameter.value,
                                  &mut path,
                              )
                          })
                  }
                  RuntimeTerminator::Conditional { .. } | RuntimeTerminator::Trap { .. } => false,
              }
          }

          fn runtime_type_uses_simd'''
          backend, count = helper_pattern.subn(helper, backend, count=1)
          if count != 1:
              raise SystemExit(f"backend: expected one direct-tail helper, found {count}")
          backend = backend.replace(
              "direct_tail_call(block)",
              "direct_tail_call(function, block)",
          )

          test_pattern = re.compile(
              r'''    #\[test\]\n    fn direct_call_return_is_a_tail_call_candidate\(\) \{\n.*?\n    fn runtime_function\(blocks: Vec<RuntimeBlock>\) -> RuntimeFunction \{''',
              re.DOTALL,
          )
          tests = '''    #[test]
              fn direct_call_return_is_a_tail_call_candidate() {
                  let block = RuntimeBlock {
                      id: 0,
                      parameters: Vec::new(),
                      operations: vec![direct_call_operation(7)],
                      terminator: RuntimeTerminator::Return {
                          value: 7,
                          span: span(),
                      },
                  };
                  let function = runtime_function(vec![block]);
                  assert_eq!(
                      direct_tail_call(&function, &function.blocks[0])
                          .map(|candidate| candidate.result),
                      Some(7)
                  );

                  let mut not_tail = function.clone();
                  not_tail.blocks[0].terminator = RuntimeTerminator::Return {
                      value: 8,
                      span: span(),
                  };
                  assert!(direct_tail_call(&not_tail, &not_tail.blocks[0]).is_none());
              }

              #[test]
              fn direct_call_forwarded_through_empty_join_is_a_tail_call_candidate() {
                  let function = runtime_function(vec![
                      RuntimeBlock {
                          id: 0,
                          parameters: Vec::new(),
                          operations: vec![direct_call_operation(7)],
                          terminator: RuntimeTerminator::Branch {
                              target: 1,
                              arguments: vec![7],
                              span: span(),
                          },
                      },
                      RuntimeBlock {
                          id: 1,
                          parameters: vec![parameter(8)],
                          operations: Vec::new(),
                          terminator: RuntimeTerminator::Return {
                              value: 8,
                              span: span(),
                          },
                      },
                  ]);

                  assert_eq!(
                      direct_tail_call(&function, &function.blocks[0])
                          .map(|candidate| candidate.result),
                      Some(7)
                  );
              }

              fn direct_call_operation(result: usize) -> RuntimeOperation {
                  RuntimeOperation {
                      kind: "call.direct",
                      result,
                      type_id: 1,
                      operands: vec![0],
                      ownership: "plain",
                      span: span(),
                      value: None,
                      update: None,
                      case: None,
                      capability: None,
                      operation: None,
                      operator: None,
                      conversion: None,
                      lane: None,
                      field: None,
                      function: Some(2),
                      signature: None,
                  }
              }

              fn runtime_function(blocks: Vec<RuntimeBlock>) -> RuntimeFunction {'''
          backend, count = test_pattern.subn(tests, backend, count=1)
          if count != 1:
              raise SystemExit(f"backend: expected one direct-tail test section, found {count}")
          backend_path.write_text(backend)

          replace_once(
              "docs/wasm-target-profile.md",
              "| tail calls                    | emitted for exact internal direct tail position | removes recursive frames and call-result local traffic                                 |",
              "| tail calls                    | exact internal direct tail position, including empty forwarding joins | removes recursive frames and call-result local traffic              |",
          )
          replace_once(
              "docs/wasm-target-profile.md",
              '''only when the call is the final operation, the returned value is that exact
          operation result, the target is an internal function, and the caller, operation,
          and callee have equal flattened result layouts. Argument layouts are checked as
          well.
          ''',
              '''only when the call is the final operation and its result reaches the function
          return either directly or through a cycle-free chain of empty forwarding blocks.
          The target must be internal, and the caller, operation, and callee must have equal
          flattened result layouts. Argument layouts are checked as well. Any intervening
          operation, condition, trap, or cycle disables the optimization.
          ''',
          )
          replace_once(
              "docs/backend.md",
              '''A `call.direct` whose result is returned immediately from an internal function
          lowers to `return_call`. The backend verifies parameter and result flattening
          before emission. This removes recursive Wasm frames without changing Blot's
          source observation model. Export wrappers are not tail-called because they must
          restore allocation checkpoints and perform canonical result lowering.
          ''',
              '''A `call.direct` whose result is returned immediately, or forwarded through only
          empty join blocks to the return, lowers to `return_call`. The backend verifies
          parameter and result flattening before emission. This removes recursive Wasm frames
          without changing Blot's source observation model. Export wrappers are not tail-called
          because they must restore allocation checkpoints and perform canonical result lowering.
          ''',
          )
          replace_once(
              "spec/RUNTIME.md",
              '''An internal direct call in exact tail position lowers to `return_call` when the
          callee and caller have the same flattened result layout. This preserves source
          returns, requests, traps, and divergence while discarding a target-only caller
          frame. Public wrappers retain ordinary calls because canonical lifting,
          lowering, call checkpoints, and post-return ownership must still execute.
          ''',
              '''An internal direct call in exact tail position lowers to `return_call` when the
          callee and caller have the same flattened result layout. Exact tail position may
          include a cycle-free chain of empty blocks that only rename the result before the
          return; any operation or control decision ends the proof. This preserves source
          returns, requests, traps, and divergence while discarding a target-only caller
          frame. Public wrappers retain ordinary calls because canonical lifting, lowering,
          call checkpoints, and post-return ownership must still execute.
          ''',
          )
          PY

          cargo fmt --manifest-path compiler/Cargo.toml
          deno fmt
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          cargo test --manifest-path compiler/Cargo.toml direct_call_
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/backend.rs \
            docs/wasm-target-profile.md \
            docs/backend.md \
            spec/RUNTIME.md \
            generated/language-health.json \
            src/diagnostic_codes.generated.ts \
            STDLIB.md
          git commit -m "Recognize tail calls through empty forwarding joins"
          git push origin HEAD:codex/v8-wasm3-target

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check stable Core metatheory
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: true
          test: false
          leanchecker: true
      - name: Reject admitted formal declarations
        shell: bash
        run: |
          if git grep -n -E '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' \
            -- formal/lean/Blot.lean 'formal/lean/Blot/*.lean'; then
            echo 'Formal sources must not contain admitted declarations.' >&2
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Rebuild Rust compiler Wasm
        run: >-
          deno run
          --allow-read
          --allow-write
          --allow-run=cargo,git,rustc
          --allow-env
          scripts/build_compiler.ts
      - name: Upload Rust compiler artifact
        uses: actions/upload-artifact@v7
        with:
          name: blot-rust-compiler
          path: |
            generated/compiler/compiler.wasm
            generated/compiler/compiler-artifact.json
          if-no-files-found: error
          retention-days: 90
      - name: Check Rust formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml -- --check
      - name: Check generated-code Rust formatting
        run: rustfmt --edition 2024 --check experiments/generated-code/counterpart.rs
      - name: Check Rust lint
        run: >-
          cargo clippy
          --manifest-path compiler/Cargo.toml
          --target wasm32-unknown-unknown
          -- -D warnings
      - name: Test Rust compiler
        run: cargo test --manifest-path compiler/Cargo.toml
      - name: Check TypeScript
        run: deno check .
      - name: Check formatting
        run: deno fmt --check
      - name: Check lint
        run: deno lint
      - name: Verify generated frontend artifacts
        run: deno task check:generated
      - name: Pack runnable Node workspace
        shell: bash
        run: |
          set -euo pipefail
          {
            git ls-files -z
            printf 'generated/compiler/compiler.wasm\0'
            printf 'generated/compiler/compiler-artifact.json\0'
            printf '.pnp.cjs\0'
            printf 'node_modules\0'
          } > "$RUNNER_TEMP/blot-node-workspace.files"
          tar \
            --create \
            --gzip \
            --file=blot-node-workspace.tar.gz \
            --null \
            --files-from="$RUNNER_TEMP/blot-node-workspace.files"
      - name: Verify packed Node workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/blot-node-workspace"
          mkdir "$workspace"
          tar -xzf blot-node-workspace.tar.gz -C "$workspace"
          cd "$workspace"
          test -f AGENTS.md
          test -f case-studies/agent/main.blot
          test -f experiments/node-wasm-benchmark.ts
          test -f generated/compiler/compiler.wasm
          test -f generated/compiler/compiler-artifact.json
          test -s .pnp.cjs
          pnpm exec tsx --import ./src/node/polyfills.mjs src/node/cli.ts check examples/minimal.blot
          pnpm exec tsx --import ./src/node/polyfills.mjs --test src/node/pipeline.test.ts
          pnpm conformance
      - name: Upload runnable Node workspace
        uses: actions/upload-artifact@v7
        with:
          name: blot-node-workspace-${{ github.sha }}
          path: blot-node-workspace.tar.gz
          if-no-files-found: error
          retention-days: 90
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run smoke
      - run: pnpm blot run examples/node-runner-demo.blot
      - run: pnpm test:compiler
      - run: pnpm verify:compiler
      - name: Verify the V8 / Wasm 3 target on Node 24 LTS
        run: pnpm test:v8-wasm
      - name: Select Node 26 Current
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
      - name: Verify the V8 / Wasm 3 target on Node 26 Current
        run: pnpm test:v8-wasm
      - run: pnpm run benchmark -- examples/storage.blot
      - name: Verify compiler artifact is derived output
        shell: bash
        run: |
          set -euo pipefail
          test -s generated/compiler/compiler.wasm
          test -s generated/compiler/compiler-artifact.json
          git check-ignore --quiet generated/compiler/compiler.wasm
          git check-ignore --quiet generated/compiler/compiler-artifact.json
          if git ls-files --error-unmatch generated/compiler/compiler.wasm >/dev/null 2>&1; then
            echo 'generated/compiler/compiler.wasm must not be tracked' >&2
            exit 1
          fi
