name: Apply V8 branch-hint target patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/v8-wasm3-branch-hints
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Apply and validate the target patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/abi.md")
          text = path.read_text()
          current = (
              "- ABI major and minor;\n"
              "- `coreSpecification`, currently `3.0`;\n"
              "- a sorted `requiredFeatures` list for every non-MVP instruction family present\n"
              "  in the artifact;\n"
              "- memory, encoding, flattening limits, and allocator export;\n"
          )
          script_anchor = (
              "- ABI major and minor;\n"
              "- memory, encoding, flattening limits, and allocator export;\n"
          )
          if text.count(current) != 1:
              raise SystemExit("docs/abi.md: could not normalize the current manifest bullets")
          path.write_text(text.replace(current, script_anchor))
          PY
          python3 scripts/apply_v8_branch_hints.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/abi.md")
          text = path.read_text()
          generated = (
              "- ABI major and minor;\n"
              "- required validation features and optional optimization metadata;\n"
              "- memory, encoding, flattening limits, and allocator export;\n"
          )
          final = (
              "- ABI major and minor;\n"
              "- `coreSpecification`, currently `3.0`;\n"
              "- a sorted `requiredFeatures` list for every non-MVP instruction family present\n"
              "  in the artifact;\n"
              "- a sorted `optimizationFeatures` list for semantically ignorable target metadata;\n"
              "- memory, encoding, flattening limits, and allocator export;\n"
          )
          if text.count(generated) != 1:
              raise SystemExit("docs/abi.md: patch did not produce the expected manifest bullets")
          path.write_text(text.replace(generated, final))
          PY
          cargo fmt --manifest-path compiler/Cargo.toml
          deno fmt \
            docs/abi.md \
            docs/v8-wasm3-feature-audit.md \
            docs/wasm-target-profile.md \
            spec/RUNTIME.md \
            src/node/v8_wasm.test.ts
          cargo test --manifest-path compiler/Cargo.toml
          cargo check \
            --manifest-path compiler/Cargo.toml \
            --target wasm32-unknown-unknown
      - name: Publish the clean review branch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm scripts/apply_v8_branch_hints.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Emit Wasm 3 branch hints for V8 cold paths"
          git push origin HEAD:codex/v8-wasm3-branch-hints
