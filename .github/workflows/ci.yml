name: Node Wasm CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rebuild Rust compiler Wasm
        run: >-
          deno run
          --allow-read
          --allow-write
          --allow-run=cargo
          --allow-env
          scripts/build_compiler.ts
      - name: Upload generated Rust compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: blot-rust-compiler-${{ github.sha }}
          path: generated/compiler/compiler.wasm
          if-no-files-found: error
          retention-days: 1
      - name: Check Rust formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml -- --check
      - name: Test Rust compiler
        run: cargo test --manifest-path compiler/Cargo.toml
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Upload runnable Node workspace
        uses: actions/upload-artifact@v4
        with:
          name: blot-node-workspace-${{ github.sha }}
          path: |
            .npmrc
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            node_modules
            src
            examples
            generated
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run smoke
      - run: pnpm blot run examples/node-runner-demo.blot
      - run: pnpm parity:strict
      - run: pnpm run benchmark -- examples/storage.blot
      - name: Verify generated Rust artifacts are committed
        run: git diff --exit-code -- generated/compiler/compiler.wasm
