name: Rust/Wasm compiler CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-v8-wasm3-target:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/v8-wasm3-target' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/v8-wasm3-target
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply reviewed target changes
        shell: bash
        run: |
          set -euo pipefail
          git show 11cc0a0a904f69484fb46869506d9689dafe5f61:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-v8-wasm3-target.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format changed files"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source[start:end].splitlines()
          )
          exec(compile(code, 'apply-v8-wasm3-target.py', 'exec'), {})
          Path('.github/workflows/apply-v8-wasm3-target.yml').unlink()
          PY
      - name: Format changed files
        shell: bash
        run: |
          cargo fmt --manifest-path compiler/Cargo.toml
          deno fmt \
            .github/workflows/ci.yml \
            docs/abi.md \
            docs/backend.md \
            docs/wasm-target-profile.md \
            package.json \
            spec/README.md \
            spec/RUNTIME.md \
            src/node/v8_wasm.test.ts
      - name: Compile backend tests
        run: cargo test --manifest-path compiler/Cargo.toml backend::tests
      - name: Commit target implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git checkout HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/apply-v8-wasm3-target.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            compiler/src/backend.rs \
            src/node/v8_wasm.test.ts \
            package.json \
            docs/abi.md \
            docs/backend.md \
            docs/wasm-target-profile.md \
            spec/README.md \
            spec/RUNTIME.md
          git diff --cached --check
          git commit -m "Target V8 with the WebAssembly 3 profile"
          git push origin HEAD:codex/v8-wasm3-target
