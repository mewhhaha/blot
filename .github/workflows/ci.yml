name: Publish V8 target health artifacts

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/v8-wasm3-branch-hints
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Regenerate and publish deterministic health outputs
        shell: bash
        run: |
          set -euo pipefail
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/language-health.json src/diagnostic_codes.generated.ts STDLIB.md
          if git diff --cached --quiet; then
            echo "health metadata is already current"
            exit 0
          fi
          git commit -m "Regenerate language health metadata"
          git push origin HEAD:codex/v8-wasm3-branch-hints
