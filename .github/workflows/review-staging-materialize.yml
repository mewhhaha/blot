name: Staging review materialization

on:
  push:
    branches: [review/materialize-staging-20260906]
    paths: [.review.patch, compiler/src/residual_identity.rs, src/node/residual_identity.test.ts, docs/theory-review-2026-09.md, .github/workflows/review-staging-materialize.yml]

permissions:
  contents: write

concurrency:
  group: staging-review-materialization
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'mewhhaha/blot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply reviewed changes to pinned main without transport files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-review"
          for path in .review.patch compiler/src/residual_identity.rs src/node/residual_identity.test.ts docs/theory-review-2026-09.md; do
            cp --parents "$path" "$RUNNER_TEMP/staging-review/"
          done
          git checkout --detach 4ca2337bbef0ad8662d9fdc1f76840db6f26427c
          git apply --check "$RUNNER_TEMP/staging-review/.review.patch"
          git apply "$RUNNER_TEMP/staging-review/.review.patch"
          for path in compiler/src/residual_identity.rs src/node/residual_identity.test.ts docs/theory-review-2026-09.md; do
            cp "$RUNNER_TEMP/staging-review/$path" "$path"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format source, tests, and contracts
        run: |
          cargo fmt --manifest-path compiler/Cargo.toml
          deno fmt LANGUAGE.md spec/STAGING.md spec/COMPILER.md experiments/language-review/README.md docs/theory-review-2026-09.md src/node/residual_identity.test.ts
          git diff --check
      - name: Test environment evidence
        run: cargo test --manifest-path compiler/Cargo.toml residual_identity
      - name: Check Rust lint
        run: cargo clippy --manifest-path compiler/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: pnpm install --frozen-lockfile
      - name: Commit only review changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler/src/eval.rs compiler/src/hir.rs compiler/src/residual_identity.rs src/node/residual_identity.test.ts LANGUAGE.md spec/STAGING.md spec/COMPILER.md experiments/language-review/README.md docs/theory-review-2026-09.md
          git commit -m 'Preserve complete closure evidence during residual specialization'
      - name: Build matching compiler artifact
        run: deno run --allow-read --allow-write --allow-run=cargo,git,rustc --allow-env scripts/build_compiler.ts
      - name: Check evaluator and emitted Wasm regressions
        run: node --import tsx --test src/node/residual_identity.test.ts
      - name: Run existing compiler performance gates
        run: node --import ./src/node/deno_test_compat.mjs --import tsx --test src/compiler/performance_gate.test.ts
      - name: Publish clean review branch for pull request CI
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin review/staging-capture-evidence)"
          git push origin HEAD:refs/heads/review/staging-capture-evidence
      - name: Package reviewed source
        if: always()
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/staging-review-source.tar.gz"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: staging-review-validation
          path: |
            ${{ runner.temp }}/staging-review-source.tar.gz
            generated/compiler/compiler.wasm
            generated/compiler/compiler-artifact.json
          retention-days: 7
      - name: Run Rust compiler suite
        run: cargo test --manifest-path compiler/Cargo.toml
