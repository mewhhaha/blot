name: Apply Blot source formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-corpus:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/source-defined-include-transforms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/source-defined-include-transforms
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Format every accepted Blot source
        run: |
          cat > .format-accepted-corpus.ts <<'TS'
          import { formatSource } from "./src/tooling/formatter.ts";

          const pendingDirectories = ["examples", "src/prelude", "case-studies"];
          const sources: string[] = [];
          while (pendingDirectories.length > 0) {
            const directory = pendingDirectories.pop();
            if (directory === undefined) break;
            for await (const entry of Deno.readDir(directory)) {
              const path = `${directory}/${entry.name}`;
              if (entry.isDirectory) {
                if (path !== "examples/rejected") pendingDirectories.push(path);
                continue;
              }
              if (entry.isFile && path.endsWith(".blot")) sources.push(path);
            }
          }

          for (const path of sources.sort()) {
            const source = await Deno.readTextFile(path);
            const formatted = await formatSource(source);
            if (!formatted.ok) {
              const codes = formatted.diagnostics.map(({ code }) => code).join(", ");
              throw new Error(`${path} did not format: ${codes}`);
            }
            if (formatted.source !== source) {
              console.log(`formatted ${path}`);
              await Deno.writeTextFile(path, formatted.source);
            }
          }
          TS
          deno run --allow-read --allow-write .format-accepted-corpus.ts
          rm .format-accepted-corpus.ts
      - name: Refresh generated language-health output
        run: deno run --allow-read --allow-write scripts/generate_language_health.ts
      - name: Verify formatter idempotence and generated output
        run: |
          node --import ./src/node/deno_test_compat.mjs --import tsx --test src/tooling/formatter.test.ts
          deno run --allow-read scripts/generate_language_health.ts --check
          deno fmt --check
      - name: Commit formatted corpus and remove this one-shot workflow
        run: |
          rm .github/workflows/codex-blot-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format accepted Blot corpus"
          git push origin HEAD:codex/source-defined-include-transforms
