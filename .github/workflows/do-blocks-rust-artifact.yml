name: do-blocks-rust-artifact

on:
  push:
    branches:
      - agent/do-blocks-ci

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Build Rust-middle compiler
        run: cargo build --target wasm32-unknown-unknown --manifest-path experiments/rust-middle/Cargo.toml
      - name: Diagnose prelude frontend
        run: |
          cat > /tmp/diagnose.ts <<'TS'
          import { RustMiddle } from "${{ github.workspace }}/src/backend/rust_middle_wasm.ts";
          import { elaborateLayout } from "${{ github.workspace }}/src/syntax/layout.ts";

          const source = await Deno.readTextFile("src/prelude/prelude.blot");
          const layout = await elaborateLayout(source);
          if (!layout.ok) {
            console.log(JSON.stringify(layout, null, 2));
            Deno.exit(1);
          }
          const wasm = await Deno.readFile("experiments/rust-middle/target/wasm32-unknown-unknown/debug/blot_rust_middle.wasm");
          const rust = await RustMiddle.load(wasm);
          const session = rust.createCompilerSession();
          try {
            const added = rust.addCompilerSessionModule(session, "snapshot:prelude", layout.layout.source);
            console.log(JSON.stringify(added, null, 2));
            if (!added.ok) {
              for (const diagnostic of added.diagnostics ?? []) {
                const start = layout.layout.originalOffset(diagnostic.span.start);
                const end = layout.layout.originalOffset(diagnostic.span.end);
                const before = source.slice(0, start);
                const line = before.split("\n").length;
                const column = start - before.lastIndexOf("\n");
                console.log(`original ${line}:${column} [${start}, ${end})`);
                console.log(source.slice(Math.max(0, start - 160), Math.min(source.length, end + 160)));
              }
              Deno.exit(1);
            }
          } finally {
            rust.destroyCompilerSession(session);
          }
          TS
          deno run --config deno.json --allow-read /tmp/diagnose.ts
