name: do-blocks-rust-artifact

on:
  push:
    branches:
      - agent/do-blocks-ci

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Teach Rust lowering about do blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('experiments/rust-middle/src/lower.rs')
          text = p.read_text()
          old = '        "block" => {\n'
          new = '        "block" | "do_block" => {\n'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one block lowering match, found {text.count(old)}')
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('block lowering match changed')
          p.write_text(text)
          PY
          cargo fmt --manifest-path experiments/rust-middle/Cargo.toml
      - name: Rebuild checked-in compiler
        run: deno task build:rust-middle
      - name: Run production corpus
        run: deno task corpus
      - name: Commit lowerer and artifact
        run: |
          git config user.name "Jacob Torrång"
          git config user.email "kopatheonlyone@hotmail.com"
          git add experiments/rust-middle/src/lower.rs generated/rust-middle/compiler.wasm generated/rust-middle/prelude.snapshot
          git commit -m "build: refresh Rust compiler for do blocks" || true
          git push origin HEAD:do-blocks
