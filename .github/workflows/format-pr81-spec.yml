name: Format PR 81 typechecking spec

on:
  push:
    branches:
      - fix/stable-rebinding-context

permissions:
  contents: write

concurrency:
  group: format-pr81-spec
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-rebinding-context

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply formatter
        run: deno fmt spec/TYPECHECKING.md

      - name: Commit formatter result
        run: |
          rm .github/workflows/format-pr81-spec.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/TYPECHECKING.md .github/workflows/format-pr81-spec.yml
          git diff --cached --check
          git commit -m "Format stable rebinding typechecking spec"
          git push origin HEAD:fix/stable-rebinding-context
