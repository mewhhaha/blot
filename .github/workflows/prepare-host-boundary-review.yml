name: Prepare host-boundary review
on:
  push:
    branches: [review/prepare-host-boundaries-20260906]
permissions:
  contents: write
concurrency:
  group: prepare-host-boundary-review
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Materialize exact reviewed source, format, and lint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          additions = ['src/compiler/host_boundaries.test.ts', 'docs/theory-implementation-review-2026-09-06.md']
          appendices = {
              'src/compiler/binary_frame.test.ts': '.review/frame-tests.ts',
              'src/node/run.test.ts': '.review/run-tests.ts',
              'spec/COHERENCE.md': '.review/coherence.md',
          }
          captured = {p: subprocess.check_output(['git', 'show', 'HEAD:' + p]) for p in additions + list(appendices.values())}
          subprocess.run(['git', 'checkout', '--detach', '03de7962b8e72365c4bb918e60309bb98f6d9cdd'], check=True)
          for p in additions:
              Path(p).write_bytes(captured[p])
          for p, appendix in appendices.items():
              Path(p).write_bytes(Path(p).read_bytes() + captured[appendix])
          def replace(path, before, after):
              p = Path(path)
              text = p.read_text()
              assert text.count(before) == 1, (path, before)
              p.write_text(text.replace(before, after))
          replace('src/compiler/binary_frame.ts',
              'const textDecoder = new TextDecoder("utf-8", { fatal: true });',
              '// Framed strings have no encoding signature: a leading U+FEFF is data.\nconst textDecoder = new TextDecoder("utf-8", { fatal: true, ignoreBOM: true });')
          replace('src/node/run.ts',
              '    return new TextDecoder("utf-8", { fatal: true }).decode(',
              '    // ABI Text has no encoding signature; retain a leading U+FEFF.\n    return new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(')
          replace('src/compiler/session.ts',
              '      if (revision.hir !== undefined) return revision.hir;',
              '      if (revision.hir !== undefined) return structuredClone(revision.hir);')
          replace('src/compiler/session.ts',
              '      revision.hir = result.module;\n      return revision.hir;',
              '      // Keep the validated resident graph private, including on the first read.\n      revision.hir = result.module;\n      return structuredClone(revision.hir);')
          replace('src/compiler/session.ts',
              r'  if (compiler.join("\0") === resolved.join("\0")) return;',
              '  if (\n    compiler.length === resolved.length &&\n    compiler.every((specifier, index) => specifier === resolved[index])\n  ) return;')
          expected = {
              'src/compiler/session.ts': '10f33b652df62c1727705979311eed608601d618',
              'src/compiler/binary_frame.ts': 'b723c36cf5a2da1478f245b067bf05802de9f28c',
              'src/compiler/binary_frame.test.ts': '3f5747a149e02b3a5aaeb166a301f2f03bda1b31',
              'src/compiler/host_boundaries.test.ts': 'd4ab5518c65c23ca00b1dc267f8e7dc67af916aa',
              'src/node/run.ts': 'cd3be4919afbfe02227408b60ef8dfb78a632a5b',
              'src/node/run.test.ts': '6dc06711d8833fd4b2f22ab23b494756d2fabf96',
              'spec/COHERENCE.md': 'cd350fb60099e4d464921adb0be4f7a04aa38e10',
              'docs/theory-implementation-review-2026-09-06.md': '0bc9d9275576248dfcf9c826b0cd873129b494c1',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
          PY
          files=(src/compiler/session.ts src/compiler/binary_frame.ts src/compiler/binary_frame.test.ts src/compiler/host_boundaries.test.ts src/node/run.ts src/node/run.test.ts spec/COHERENCE.md docs/theory-implementation-review-2026-09-06.md)
          deno fmt "${files[@]}"
          deno fmt --check "${files[@]}"
          deno lint src/compiler/session.ts src/compiler/binary_frame.ts src/compiler/binary_frame.test.ts src/compiler/host_boundaries.test.ts src/node/run.ts src/node/run.test.ts
          git add "${files[@]}"
          git diff --cached --check
          git -c user.name='Blot review' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve host text, HIR snapshot ownership, and dependency agreement'
          git push origin HEAD:refs/heads/review/host-boundary-integrity
          mkdir -p /tmp/host-boundary-review
          git rev-parse HEAD > /tmp/host-boundary-review/commit.txt
          git archive HEAD "${files[@]}" > /tmp/host-boundary-review/source.tar
          git diff 03de7962b8e72365c4bb918e60309bb98f6d9cdd HEAD --binary > /tmp/host-boundary-review/review.patch
      - uses: actions/upload-artifact@v7
        with:
          name: host-boundary-review
          path: /tmp/host-boundary-review/
          retention-days: 7
