name: Prepare host-boundary review
on:
  push:
    branches: [review/prepare-host-boundaries-20260906]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Materialize the reviewed patch and check formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 03de7962b8e72365c4bb918e60309bb98f6d9cdd
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'ab4837fb0789fb12bd6013a688be7861ae911038c23f85bb4b8bc69ffc28ca3c'
          Path('/tmp/host-boundary-review.patch').write_bytes(patch)
          PY
          git apply --index /tmp/host-boundary-review.patch
          files=(src/compiler/session.ts src/compiler/binary_frame.ts src/compiler/binary_frame.test.ts src/compiler/host_boundaries.test.ts src/node/run.ts src/node/run.test.ts spec/COHERENCE.md docs/theory-implementation-review-2026-09-06.md)
          deno fmt "${files[@]}"
          deno fmt --check "${files[@]}"
          deno lint src/compiler/session.ts src/compiler/binary_frame.ts src/compiler/binary_frame.test.ts src/compiler/host_boundaries.test.ts src/node/run.ts src/node/run.test.ts
          git add "${files[@]}"
          git diff --cached --check
          git -c user.name='Blot review' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve host text, HIR snapshot ownership, and dependency agreement'
          git push origin HEAD:refs/heads/review/host-boundary-integrity
          mkdir -p /tmp/host-boundary-review
          git rev-parse HEAD > /tmp/host-boundary-review/commit.txt
          git archive HEAD "${files[@]}" > /tmp/host-boundary-review/source.tar
          git diff 03de7962b8e72365c4bb918e60309bb98f6d9cdd HEAD --binary > /tmp/host-boundary-review/review.patch
      - uses: actions/upload-artifact@v7
        with:
          name: host-boundary-review
          path: /tmp/host-boundary-review/
          retention-days: 7
