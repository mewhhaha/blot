name: Owned Region Dev

on:
  push:
    branches:
      - codex/owned-slices
    paths:
      - experiments/owned-regions/.production-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/owned-slices
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: extractions/setup-just@v3
      - name: Materialize, rebase, gate, and publish production patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main codex/owned-slices
          git pull --rebase origin codex/owned-slices
          SOURCE_HEAD=$(git rev-parse HEAD)
          BASE=$(git merge-base origin/main "$SOURCE_HEAD")
          echo "source=$SOURCE_HEAD"
          echo "merge-base=$BASE"
          echo "main=$(git rev-parse origin/main)"

          python3 experiments/owned-regions/finalize_production.py
          python3 experiments/owned-regions/finalize_slice_namespace.py
          python3 experiments/owned-regions/fix_rust_region_generalization.py
          python3 experiments/owned-regions/fix_rust_region_snapshot_closedness.py
          cp experiments/owned-regions/fix_recursive_signature_groups.py /tmp/fix_recursive_signature_groups.py

          python3 - <<'PY'
          from pathlib import Path
          roots = [
              Path("src"),
              Path("examples/owned_slice_quicksort.blot"),
              Path("experiments/owned-regions/source_surface.test.ts"),
              Path("experiments/owned-regions/wasm_region.test.ts"),
              Path("experiments/rust-middle/src"),
              Path("spec/OWNED_REGIONS.md"),
          ]
          paths = []
          for root in roots:
              if root.is_dir():
                  paths.extend(path for path in root.rglob("*") if path.is_file())
              elif root.exists():
                  paths.append(root)
          for path in paths:
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if "@region.array." in text:
                  path.write_text(text.replace("@region.array.", "@region."))
          PY

          cargo fmt --manifest-path experiments/rust-middle/Cargo.toml
          deno fmt \
            src/check/bridge.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/check/region_primitives.ts \
            src/check/type.ts \
            src/comptime/value.ts \
            src/comptime/region_primitives.ts \
            src/core/type_rep.ts \
            src/linear/certificate.ts \
            src/linear/check.ts \
            experiments/owned-regions/source_surface.test.ts \
            experiments/owned-regions/wasm_region.test.ts
          deno run --allow-read --allow-write src/cli.ts fmt src/prelude/prelude.blot
          deno run --allow-read --allow-write src/cli.ts fmt examples/owned_slice_quicksort.blot
          git diff --check

          PRODUCTION=(
            examples/owned_slice_quicksort.blot
            experiments/owned-regions/source_surface.test.ts
            experiments/owned-regions/wasm_region.test.ts
            experiments/rust-middle/src/backend.rs
            experiments/rust-middle/src/hir.rs
            experiments/rust-middle/src/ownership.rs
            experiments/rust-middle/src/primitives.rs
            experiments/rust-middle/src/session.rs
            experiments/rust-middle/src/typecheck.rs
            experiments/rust-middle/src/value.rs
            spec/OWNED_REGIONS.md
            src/check/bridge.ts
            src/check/constrain.ts
            src/check/print.ts
            src/check/region_primitives.ts
            src/check/type.ts
            src/comptime/region_primitives.ts
            src/comptime/value.ts
            src/core/type_rep.ts
            src/linear/certificate.ts
            src/linear/check.ts
            src/prelude/prelude.blot
          )
          tar -cf /tmp/owned-slice-production.tar "${PRODUCTION[@]}"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard "$BASE"
          git clean -fdx
          tar -xf /tmp/owned-slice-production.tar
          git add "${PRODUCTION[@]}"
          git commit -m 'feat: add owned Slice regions'
          SQUASH=$(git rev-parse HEAD)

          git switch -C codex-owned-slices-rebased origin/main
          git config merge.renames true
          if ! git cherry-pick "$SQUASH"; then
            echo '--- cherry-pick conflicts ---'
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi

          if test -d experiments/rust-middle; then
            echo 'retired experiments/rust-middle path survived rename merge'
            find experiments/rust-middle -maxdepth 2 -type f -print
            exit 1
          fi

          python3 /tmp/fix_recursive_signature_groups.py

          python3 - <<'PY'
          from pathlib import Path

          test = Path("experiments/owned-regions/wasm_region.test.ts")
          text = test.read_text()
          text = text.replace(
              "../../src/backend/rust_middle.ts",
              "../../src/compiler/session.ts",
          )
          text = text.replace(
              "../../src/backend/runtime/hir.ts",
              "../../src/runtime/hir.ts",
          )
          text = text.replace("RustMiddleCompiler", "Compiler")
          test.write_text(text)

          spec = Path("spec/OWNED_REGIONS.md")
          text = spec.read_text()
          text = text.replace("experiments/rust-middle", "compiler")
          text = text.replace("generated/rust-middle", "generated/compiler")
          text = text.replace("RustMiddleCompiler", "Compiler")
          spec.write_text(text)
          PY

          deno fmt \
            src/check/bridge.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/check/region_primitives.ts \
            src/check/type.ts \
            src/comptime/value.ts \
            src/comptime/region_primitives.ts \
            src/core/type_rep.ts \
            src/linear/certificate.ts \
            src/linear/check.ts \
            experiments/owned-regions/source_surface.test.ts \
            experiments/owned-regions/wasm_region.test.ts
          deno run --allow-read --allow-write src/cli.ts fmt src/prelude/prelude.blot
          deno run --allow-read --allow-write src/cli.ts fmt examples/owned_slice_quicksort.blot
          cargo fmt --manifest-path compiler/Cargo.toml

          cargo check --manifest-path compiler/Cargo.toml --target wasm32-unknown-unknown
          deno task build:compiler
          git add -A
          git commit --amend --no-edit
          FINAL_HEAD=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"

          echo '--- final production diff ---'
          git diff --stat origin/main...HEAD
          git diff --name-only origin/main...HEAD

          if git diff --name-only origin/main...HEAD | grep -E \
            '(^\.github/workflows/owned-region-dev\.yml$|experiments/owned-regions/(model|quicksort|integration|acquisition|certificate|interval|root_claim|store_provenance|trace_branch|apply_|finalize_|finish_|fix_|patch_|run_patch|\.production|\.source|\.sync)|^experiments/rust-middle/|^src/linear/region_(certificate|family|interval)\.ts$)'; then
            echo 'review scaffolding survived the clean squash'
            exit 1
          fi

          deno run --allow-read src/cli.ts check examples/owned_slice_quicksort.blot
          deno test --allow-read --allow-write \
            experiments/owned-regions/source_surface.test.ts \
            experiments/owned-regions/wasm_region.test.ts
          deno task corpus
          just check
          just test
          git diff --check HEAD^ HEAD
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"

          git push \
            --force-with-lease=refs/heads/codex/owned-slices:"$SOURCE_HEAD" \
            origin HEAD:codex/owned-slices
