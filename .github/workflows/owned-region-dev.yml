name: Owned Region Dev

on:
  push:
    branches:
      - codex/owned-slices
    paths:
      - experiments/owned-regions/.production-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/owned-slices
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: extractions/setup-just@v3
      - name: Apply production Region patch and run gates
        run: |
          git pull --rebase origin codex/owned-slices
          python3 experiments/owned-regions/finalize_production.py
          python3 experiments/owned-regions/finalize_slice_namespace.py
          python3 experiments/owned-regions/fix_rust_region_generalization.py
          python3 experiments/owned-regions/fix_rust_region_snapshot_closedness.py
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              "src/check/region_primitives.ts",
              "src/comptime/region_primitives.ts",
              "src/linear/check.ts",
              "experiments/rust-middle/src/primitives.rs",
              "experiments/rust-middle/src/typecheck.rs",
              "experiments/rust-middle/src/ownership.rs",
              "experiments/rust-middle/src/hir.rs",
              "src/prelude/prelude.blot",
              "experiments/owned-regions/source_surface.test.ts",
              "experiments/owned-regions/wasm_region.test.ts",
              "experiments/owned-regions/integration.test.ts",
              "spec/OWNED_REGIONS.md",
          ]
          for name in paths:
              path = Path(name)
              if path.exists():
                  path.write_text(path.read_text().replace("@region.array.", "@region."))
          PY
          cargo fmt --manifest-path experiments/rust-middle/Cargo.toml
          deno fmt \
            src/check/bridge.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/check/region_primitives.ts \
            src/comptime/value.ts \
            src/comptime/region_primitives.ts \
            src/linear/check.ts \
            experiments/owned-regions/source_surface.test.ts \
            experiments/owned-regions/wasm_region.test.ts \
            experiments/owned-regions/integration.test.ts
          deno run --allow-read --allow-write src/cli.ts fmt src/prelude/prelude.blot
          deno run --allow-read --allow-write src/cli.ts fmt examples/owned_slice_quicksort.blot
          cargo check --manifest-path experiments/rust-middle/Cargo.toml --target wasm32-unknown-unknown
          deno task build:rust-middle

          cat > examples/__region_diag_rec_passthrough.blot <<'BLOT'
          open @import "blot:prelude" ()
          let pass =
            rec (fn (region, n) =>
              if n < 1:
                return region
              else:
                return pass (!region, n - 1)
            )
          let region = Slice.claim [1, 2]
          return Slice.freeze (pass (!region, 1))
          BLOT
          cat > examples/__region_diag_rec_read.blot <<'BLOT'
          open @import "blot:prelude" ()
          let pass =
            rec (fn (region, n) =>
              let value = case Slice.get ((&region), 0) of
                #Some item => item
                #None => 0
              if n < 1:
                return (region, value)
              else:
                return pass (!region, n - 1)
            )
          let region = Slice.claim [1, 2]
          let (region, value) = pass (!region, 1)
          let _ = Slice.freeze (!region)
          return value
          BLOT
          cat > examples/__region_diag_rec_swap.blot <<'BLOT'
          open @import "blot:prelude" ()
          let swap_once = fn region =>
            return case Slice.swap ((!region), 0, 1) of
              #Updated !updated => updated
              #SwapOutOfBounds !original => original
          let pass =
            rec (fn (region, n) =>
              if n < 1:
                return region
              else:
                let region = swap_once (!region)
                return pass (!region, n - 1)
            )
          let region = Slice.claim [1, 2]
          return Slice.freeze (pass (!region, 1))
          BLOT
          cat > examples/__region_diag_nonrec_partition.blot <<'BLOT'
          open @import "blot:prelude" ()
          let keep_swap = fn (region, left, right) =>
            return case Slice.swap ((!region), left, right) of
              #Updated !updated => updated
              #SwapOutOfBounds !original => original
          let partition = fn (region, pivot, scan, boundary) =>
            let current = case Slice.get ((&region), scan) of
              #Some value => value
              #None => pivot
            if current <= pivot:
              return (keep_swap ((!region), scan, boundary), boundary + 1)
            else:
              return (region, boundary)
          let region = Slice.claim [2, 1]
          let (region, _) = partition (!region, 2, 0, 0)
          return Slice.freeze (!region)
          BLOT
          for f in examples/__region_diag_*.blot; do
            echo "===== $f ====="
            deno run --allow-read src/cli.ts check "$f" || true
          done
          rm examples/__region_diag_*.blot

          deno run --allow-read src/cli.ts check examples/owned_slice_quicksort.blot
          deno test --allow-read --allow-write experiments/owned-regions/*.test.ts
          deno task corpus
          just check
          just test
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/check/bridge.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/check/region_primitives.ts \
            src/comptime/value.ts \
            src/comptime/region_primitives.ts \
            src/linear/check.ts \
            experiments/rust-middle/src/typecheck.rs \
            experiments/rust-middle/src/primitives.rs \
            experiments/rust-middle/src/ownership.rs \
            experiments/rust-middle/src/hir.rs \
            src/prelude/prelude.blot \
            examples/owned_slice_quicksort.blot \
            experiments/owned-regions/source_surface.test.ts \
            experiments/owned-regions/wasm_region.test.ts \
            experiments/owned-regions/integration.test.ts \
            spec/OWNED_REGIONS.md \
            generated/rust-middle/compiler.wasm \
            generated/rust-middle/prelude.snapshot
          if ! git diff --cached --quiet; then
            git commit -m 'feat: finish owned Slice production path'
            git push origin HEAD:codex/owned-slices
          fi
