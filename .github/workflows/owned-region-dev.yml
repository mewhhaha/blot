name: Owned Region Dev

on:
  push:
    branches:
      - codex/owned-slices
    paths:
      - experiments/owned-regions/.production-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/owned-slices
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: extractions/setup-just@v3
      - name: Apply production Region patch and run gates
        run: |
          git pull --rebase origin codex/owned-slices
          python3 experiments/owned-regions/finalize_production.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/prelude/prelude.blot")
          source = path.read_text()
          for old, new in [
              (".get = fn (&region, index) =>", ".get = fn (region, index) =>"),
              (".set = fn (!region, index, value) =>", ".set = fn (region, index, value) =>"),
              (".swap = fn (!region, left, right) =>", ".swap = fn (region, left, right) =>"),
              (".split = fn (!region, index) =>", ".split = fn (region, index) =>"),
              (".join = fn (!left, !right) =>", ".join = fn (left, right) =>"),
          ]:
              if old not in source:
                  raise SystemExit(f"missing Slice wrapper anchor: {old}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo fmt --manifest-path experiments/rust-middle/Cargo.toml
          deno fmt \
            src/check/bridge.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/comptime/value.ts \
            src/linear/check.ts \
            experiments/owned-regions/source_surface.test.ts \
            experiments/owned-regions/wasm_region.test.ts
          deno run --allow-read --allow-write src/cli.ts fmt src/prelude/prelude.blot
          deno run --allow-read --allow-write src/cli.ts fmt examples/owned_slice_quicksort.blot
          cargo check --manifest-path experiments/rust-middle/Cargo.toml --target wasm32-unknown-unknown
          deno task build:rust-middle
          deno test --allow-read --allow-write experiments/owned-regions/*.test.ts
          deno task corpus
          just check
          just test
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/check/bridge.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/comptime/value.ts \
            src/linear/check.ts \
            experiments/rust-middle/src/typecheck.rs \
            experiments/rust-middle/src/primitives.rs \
            experiments/rust-middle/src/ownership.rs \
            experiments/rust-middle/src/hir.rs \
            src/prelude/prelude.blot \
            examples/owned_slice_quicksort.blot \
            experiments/owned-regions/source_surface.test.ts \
            experiments/owned-regions/wasm_region.test.ts \
            generated/rust-middle/compiler.wasm \
            generated/rust-middle/prelude.snapshot
          if ! git diff --cached --quiet; then
            git commit -m 'feat: finish owned Slice production path'
            git push origin HEAD:codex/owned-slices
          fi
