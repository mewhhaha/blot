name: Owned Region Dev

on:
  push:
    branches:
      - codex/owned-slices
    paths:
      - experiments/owned-regions/.production-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/owned-slices
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Apply Rust Region type and evaluator patch
        run: |
          git pull --rebase origin codex/owned-slices
          python3 experiments/owned-regions/apply_rust_region.py
          python3 experiments/owned-regions/finish_rust_region_compile.py
          cargo fmt --manifest-path experiments/rust-middle/Cargo.toml
          cargo check --manifest-path experiments/rust-middle/Cargo.toml --target wasm32-unknown-unknown
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            experiments/rust-middle/src/value.rs \
            experiments/rust-middle/src/primitives.rs \
            experiments/rust-middle/src/typecheck.rs \
            experiments/rust-middle/src/hir.rs \
            experiments/rust-middle/src/session.rs
          git commit -m 'feat: add Region type and evaluator to Rust middle'
          git push origin HEAD:codex/owned-slices
