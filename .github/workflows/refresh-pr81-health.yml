name: Refresh PR 81 language health

on:
  push:
    branches:
      - fix/stable-rebinding-context

permissions:
  contents: write

concurrency:
  group: refresh-pr81-health
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-rebinding-context

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate language health
        run: pnpm generate:health

      - name: Commit generated manifest
        run: |
          rm .github/workflows/refresh-pr81-health.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/language-health.json .github/workflows/refresh-pr81-health.yml
          git diff --cached --check
          git commit -m "Refresh language health for stable rebinding fix"
          git push origin HEAD:fix/stable-rebinding-context
