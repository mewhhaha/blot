name: do-blocks-refine

on:
  push:
    branches:
      - agent/do-blocks-ci

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Retain do block as a parser island
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('baba.json')
          data = json.loads(p.read_text())
          islands = data['gpuFrontend']['islands']
          if not any(item['rule'] == 'do_block' for item in islands):
              index = next(i for i, item in enumerate(islands) if item['rule'] == 'block')
              islands.insert(index, {
                  'rule': 'do_block',
                  'boundary': {'kind': 'terminated', 'terminal': 'LAYOUT_DEDENT'},
              })
          scopes = data['gpuFrontend']['semantics']['scopes']
          if 'do_block' not in scopes:
              scopes.insert(scopes.index('block') + 1, 'do_block')
          p.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('src/syntax/compact_schema.ts')
          text = p.read_text()
          text = text.replace(
              '  "block.statements",\n  "continued_primary_expression.statements",\n  "element_child_primary_expression.statements",\n  "primary_expression.statements",\n',
              '  "block.statements",\n  "do_block.statements",\n',
          )
          p.write_text(text)

          p = Path('src/syntax/lower.ts')
          text = p.read_text()
          text, n = re.subn(
              r'\nfunction isDoBlockPrimary\(rule: Rule\): boolean \{[\s\S]*?\n\}\n\nfunction lowerPostfix',
              '\nfunction lowerPostfix',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('lower.ts: expected flattened do helper')
          old = '''function lowerPostfix(rule: Rule, context: Context): Expr {\n  const primary = asRule(field(rule, "value"), "value");\n  let result = lowerPrimary(\n    isDoBlockPrimary(primary) ? primary : unwrap(primary),\n    context,\n  );'''
          new = '''function lowerPostfix(rule: Rule, context: Context): Expr {\n  let result = lowerPrimary(\n    unwrap(asRule(field(rule, "value"), "value")),\n    context,\n  );'''
          if old not in text:
              raise SystemExit('lower.ts: lowerPostfix shape changed')
          text = text.replace(old, new, 1)
          text = text.replace(
              '  if (rule.name === "block" || isDoBlockPrimary(rule)) {',
              '  if (rule.name === "block" || rule.name === "do_block") {',
              1,
          )
          p.write_text(text)

          p = Path('src/tooling/formatter.ts')
          text = p.read_text()
          text = text.replace(
              '  "array",\n  "block",\n  "case_expression",',
              '  "array",\n  "block",\n  "do_block",\n  "case_expression",',
              1,
          )
          text = text.replace(
              'const blockRule = new Set(["block"]);',
              'const blockRule = new Set(["block", "do_block"]);',
              1,
          )
          text = text.replace(
              'const valueScopeBoundaryRules = new Set([\n  "block",\n',
              'const valueScopeBoundaryRules = new Set([\n  "block",\n  "do_block",\n',
              1,
          )
          text = text.replace(
              '        let valueScopeOwnsLayout = expressionPrimaryIsDo(expression);',
              '        let valueScopeOwnsLayout = expressionPrimaryIs(expression, "do_block");',
              1,
          )
          text = text.replace(
              '      : node.name === "block" || node.name === "statement_suite" ||\n          isDoBlockPrimaryRule(node)\n      ? "statement"',
              '      : blockRule.has(node.name) || node.name === "statement_suite"\n      ? "statement"',
              1,
          )
          text = text.replace(
              '      (containsRule(body, layoutSensitiveRules) ||\n        expressionPrimaryIsDo(body)) &&',
              '      containsRule(body, layoutSensitiveRules) &&',
              1,
          )
          text = text.replace(
              '      if (blockRule.has(ancestor.name) || isDoBlockPrimaryRule(ancestor)) {\n        return false;\n      }',
              '      if (blockRule.has(ancestor.name)) return false;',
              1,
          )
          text = text.replace(
              '  return expressionPrimaryIs(expression, "block") ||\n    expressionPrimaryIsDo(expression);',
              '  return expressionPrimaryIs(expression, "block") ||\n    expressionPrimaryIs(expression, "do_block");',
              1,
          )
          text, n = re.subn(
              r'\nfunction expressionPrimaryIsDo\(expression: ConcreteRule\): boolean \{[\s\S]*?\n\}\n\nfunction isDoBlockPrimaryRule\(rule: ConcreteRule\): boolean \{[\s\S]*?\n\}\n',
              '\n',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('formatter.ts: expected flattened do helpers')
          text = text.replace(
              '  if (isDoBlockPrimaryRule(node)) {',
              '  if (node.name === "do_block") {',
              1,
          )
          text = text.replace(
              '            ancestor.name === "block" || ancestor.name === "lambda"',
              '            blockRule.has(ancestor.name) || ancestor.name === "lambda"',
              1,
          )
          p.write_text(text)
          PY
      - name: Regenerate parser artifacts
        run: |
          deno task generate
          deno task generate:rust-middle-schema
      - name: Format touched files
        run: deno fmt baba.json src/syntax/compact_schema.ts src/syntax/lower.ts src/tooling/formatter.ts generated/wasm/syntax.ts generated/.baba-manifest.json experiments/rust-middle/src/schema.rs experiments/rust-middle/src/frontend_plan.rs
      - name: Focused tests
        run: |
          deno test --allow-read --allow-write src/syntax/layout.test.ts
          deno test --allow-read --allow-write src/syntax/surface.test.ts --filter "do is an explicit"
          deno test --allow-read --allow-write src/tooling/formatter.test.ts --filter "explicit do block"
          deno test --allow-read --allow-write examples.test.ts --filter "do_blocks"
      - name: Inspect parser profile
        run: deno task inspect | tee /tmp/do-blocks-profile.txt
      - name: Commit refinement
        run: |
          git config user.name "Jacob Torrång"
          git config user.email "kopatheonlyone@hotmail.com"
          git add -A
          git commit -m "parser: retain explicit do block scope"
          git push origin HEAD:do-blocks
