name: Finalize consolidated operator repairs

on:
  push:
    branches:
      - integrate/operator-dispatch-language-review
    paths:
      - .github/workflows/operator-repair-finalize.yml

permissions:
  contents: read

jobs:
  finalize:
    if: github.repository == 'mewhhaha/blot' && github.ref == 'refs/heads/integrate/operator-dispatch-language-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the reviewed repair without weakening CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          def blob(path):
              data = Path(path).read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          patch = Path('scripts/operator-repair.patch')
          patch.write_text(patch.read_text().replace('\n diff --git ', '\ndiff --git '))
          assert blob(patch) == 'd3847926554bdd8efd1c269ee080a05627d71e21', 'Unexpected repair patch'
          before = {
              'compiler/src/member_constraints.rs': 'b620746fdec7e3bf56b5f880d0637437bfd1265c',
              'compiler/src/hir.rs': 'c2b162ae904bf420e7d215aa1635c0674aba2855',
              'compiler/src/member_constraint_tests.rs': '8fca15f142c98bbdf59c3cc69b38c7f9ab1524d8',
              'LANGUAGE.md': '5a80de9ba6595fdaf0292c760125b0288ef083e0',
              'spec/TYPECHECKING.md': '0298933856cb2f5630c32ce9cb30535916f20c38',
              'spec/STAGING.md': '72fe6d86f0f3e01c2e5ca8548a2ec1c65780077b',
          }
          for path, expected in before.items():
              assert blob(path) == expected, f'Unexpected source: {path}'
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          after = {
              'compiler/src/member_constraints.rs': '59422865e1aa8ecdc2fc6ca8899f3fe2ccff5cb6',
              'compiler/src/hir.rs': 'e0330a4b56e1df0ca3d986fad7e0eb9bee8f3f2d',
              'compiler/src/member_constraint_tests.rs': 'd4c19b445bf0fcf398d0df011555925e581d1dbb',
              'LANGUAGE.md': '03757874ad8d560019186580ab491c05d2518596',
              'spec/TYPECHECKING.md': 'ec9d4c441d2f979699f85abde32769df5e221738',
              'spec/STAGING.md': '6b989df6525ed7f37a68576b2dc6e74d5ba45b49',
          }
          for path, expected in after.items():
              assert blob(path) == expected, f'Unexpected repair result: {path}'
          patch.unlink()
          Path('.github/workflows/operator-repair-finalize.yml').unlink()
          PY
          git diff --check
          git add compiler/src/member_constraints.rs compiler/src/hir.rs compiler/src/member_constraint_tests.rs LANGUAGE.md spec/TYPECHECKING.md spec/STAGING.md scripts/operator-repair.patch .github/workflows/operator-repair-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve upper member evidence and stage unresolved ordinary helpers'
          git merge --no-ff --no-commit e60b49dac2ae5100fb3e0b5ec46b343f9ff5a060
          git checkout e60b49dac2ae5100fb3e0b5ec46b343f9ff5a060 -- src/tooling/control_flow.ts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          data = Path('src/tooling/control_flow.ts').read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'dd24f48cc0206acabe4f9fe9cb5b4ef484b6f701'
          source = Path('src/language_service.test.ts').read_text()
          assert '"`Op.negate`"' in source, 'Lost actual operator fixity assertion'
          assert '"**return** — supplies the result of this module."' in source, 'Lost exact module return assertion'
          assert 'operator hover uses the active source fixity' in source, 'Lost source fixity regression'
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U']).strip(), 'Unresolved merge conflicts'
          assert subprocess.check_output(['git', 'show', 'e60b49dac2ae5100fb3e0b5ec46b343f9ff5a060:.github/workflows/ci.yml']) == Path('.github/workflows/ci.yml').read_bytes(), 'Standard CI changed'
          for name in ['operator-repair-finalize.yml', 'operator-development.yml', 'operator-iteration.yml', 'operator-sandbox.yml', 'language-review-tools.yml', 'library-docs-finalize.yml']:
              assert not (Path('.github/workflows') / name).exists(), f'Temporary workflow remains: {name}'
          PY
          git diff --check
          git add src/tooling/control_flow.ts
          git commit -m 'Integrate validated libraries and practical workflows from main'
          git push origin HEAD:refs/heads/integrate/operator-dispatch-language-review
