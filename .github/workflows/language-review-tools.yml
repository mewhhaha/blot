name: Language review offline tools

on:
  pull_request:
    paths:
      - .github/workflows/language-review-tools.yml

permissions:
  contents: read

jobs:
  tools:
    if: >-
      github.event.pull_request.number == 87 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'language/evidence-and-syntax-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Collect public build tools and locked dependency sources
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          stage="$RUNNER_TEMP/blot-offline-tools"
          mkdir -p "$stage/rust" "$stage/cargo" "$stage/bin"
          toolchain="$(rustc --print sysroot)"
          cp -a "$toolchain/bin" "$toolchain/lib" "$stage/rust/"
          cp -a "$HOME/.cargo/registry" "$stage/cargo/"
          cp "$(command -v deno)" "$stage/bin/deno"
          rustc --version > "$stage/VERSIONS.txt"
          cargo --version >> "$stage/VERSIONS.txt"
          deno --version >> "$stage/VERSIONS.txt"
          tar -C "$stage" -czf "$RUNNER_TEMP/blot-offline-tools.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: blot-offline-tools
          path: ${{ runner.temp }}/blot-offline-tools.tar.gz
          if-no-files-found: error
          retention-days: 3
