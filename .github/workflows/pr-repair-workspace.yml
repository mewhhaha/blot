name: PR repair workspace

on:
  push:
    branches:
      - repair/pr-integration-20260906
    paths:
      - .github/workflows/pr-repair-workspace.yml

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact sources and history for local repair
        run: |
          git bundle create "$RUNNER_TEMP/blot-repair.bundle" --all
          git rev-parse HEAD
          git rev-parse origin/main
          git rev-parse origin/perf/linear-layout-text-search-20260906
          git rev-parse origin/codex/review-implementation-20260906
      - uses: actions/upload-artifact@v7
        with:
          name: blot-repair-sources
          path: ${{ runner.temp }}/blot-repair.bundle
          retention-days: 1
          if-no-files-found: error
