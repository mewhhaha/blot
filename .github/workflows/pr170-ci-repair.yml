name: Inspect and prepare PR 170 CI repair

on:
  push:
    branches: ['workbench/pr170-ci-repair-20260917']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Merge the exact green shared-repair foundation into an isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          base=5f6457b759a2faf888978c1fb89420d7b6e7f055
          foundation=02134f36514b9185cbe514b9a33dd0e2c482e768
          git fetch --no-tags origin "$base" "$foundation"
          git checkout --detach "$base"
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          if ! git merge --no-ff --no-commit "$foundation"; then
            git diff --cc > "$RUNNER_TEMP/pr170-merge-conflicts.patch"
            git status --short
            exit 1
          fi
          git diff --exit-code "$base" -- compiler/src src/node src/compiler generated/compiler
          git commit -m 'Merge shared CI repair foundation from PR 161 into type-system branch'
      - name: Regenerate inventory and use the same formatter and linter as CI
        shell: bash
        run: |
          set -euo pipefail
          deno --version
          deno fmt
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          deno fmt --check
          deno lint
          deno run --allow-read scripts/generate_language_health.ts --check
          git diff --check
          if ! git diff --quiet; then
            git add -u
            git commit -m 'fix: refresh generated inventory and canonical formatting for CI'
          fi
          base=5f6457b759a2faf888978c1fb89420d7b6e7f055
          git diff --exit-code "$base" HEAD -- compiler/src src/node src/compiler generated/compiler
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor 02134f36514b9185cbe514b9a33dd0e2c482e768 HEAD
          git diff --binary "$base" HEAD > "$RUNNER_TEMP/pr170-ci-repair.patch"
          git diff --stat "$base" HEAD
          git push origin HEAD:refs/heads/workbench/pr170-ci-foundation-candidate-20260917
          git bundle create "$RUNNER_TEMP/pr170-ci-candidate.bundle" HEAD
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tree: $(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          echo 'No PR or main reference was changed; inspect the candidate before publication.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr170-ci-repair
          path: |
            ${{ runner.temp }}/pr170-merge-conflicts.patch
            ${{ runner.temp }}/pr170-ci-repair.patch
            ${{ runner.temp }}/pr170-ci-candidate.bundle
          if-no-files-found: warn
          retention-days: 3
