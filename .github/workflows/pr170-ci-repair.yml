name: Inspect and prepare PR 170 CI repair

on:
  push:
    branches: ['workbench/pr170-ci-repair-20260917']

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Generate an isolated formatting candidate for inspection
        shell: bash
        run: |
          set -euo pipefail
          base=5f6457b759a2faf888978c1fb89420d7b6e7f055
          git fetch --no-tags origin "$base"
          git checkout --detach "$base"
          deno --version
          deno fmt LANGUAGE.md spec/STAGING.md
          git diff --binary > "$RUNNER_TEMP/pr170-formatting.patch"
          python3 - <<'PY'
          import subprocess
          allowed = {'LANGUAGE.md', 'spec/STAGING.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed and changed <= allowed, changed
          PY
          deno fmt --check
          deno lint
          git diff --check
          git diff --stat
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add LANGUAGE.md spec/STAGING.md
          git commit -m 'fix: canonical Markdown formatting for PR 170 CI'
          git push origin HEAD:refs/heads/workbench/pr170-ci-candidate-20260917
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No PR or main reference was changed; inspect the exported diff before publication.' >> "$GITHUB_STEP_SUMMARY"
      - name: Export formatter and source for offline validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-tools"
          cp "$(which deno)" "$RUNNER_TEMP/ci-tools/deno"
          deno --version > "$RUNNER_TEMP/ci-tools/deno-version.txt"
          tar -czf "$RUNNER_TEMP/ci-tools.tgz" -C "$RUNNER_TEMP" ci-tools
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr170-formatting-repair
          path: |
            ${{ runner.temp }}/pr170-formatting.patch
            ${{ runner.temp }}/ci-tools.tgz
          if-no-files-found: error
          retention-days: 3
