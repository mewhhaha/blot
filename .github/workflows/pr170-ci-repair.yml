name: Prepare PR 170 CI repair

on:
  push:
    branches: ['workbench/pr170-ci-repair-20260917']
    paths: ['.github/workflows/pr170-ci-repair.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format exact PR head without changing compiler or validation policy
        shell: bash
        run: |
          set -euo pipefail
          base=5f6457b759a2faf888978c1fb89420d7b6e7f055
          git checkout --detach "$base"
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          deno fmt
          deno fmt --check
          git diff --exit-code -- .github compiler src generated deno.json package.json scripts
          git diff --check
          git add -u
          git commit -m 'style: repair repository formatting blocking PR 170 CI'
          git push origin HEAD:refs/heads/workbench/pr170-ci-formatted-20260917
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat "$base" HEAD >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/pr170-repair"
          git diff --binary "$base" HEAD > "$RUNNER_TEMP/pr170-repair/formatting.patch"
          git bundle create "$RUNNER_TEMP/pr170-repair/repository.bundle" --all HEAD
          cp "$(command -v deno)" "$RUNNER_TEMP/pr170-repair/deno"
          git rev-parse HEAD > "$RUNNER_TEMP/pr170-repair/head.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/pr170-repair/tree.txt"
      - name: Record downstream lint without suppressing failure
        shell: bash
        run: |
          set -euo pipefail
          deno lint 2>&1 | tee "$RUNNER_TEMP/pr170-repair/lint.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr170-ci-repair-inputs
          path: ${{ runner.temp }}/pr170-repair
          if-no-files-found: error
          retention-days: 3
