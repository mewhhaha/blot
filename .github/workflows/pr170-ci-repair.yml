name: Inspect and prepare PR 170 CI repair

on:
  push:
    branches: ['workbench/pr170-ci-repair-20260917']

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format the two Markdown files reported by current CI
        shell: bash
        run: |
          set -euo pipefail
          base=5f6457b759a2faf888978c1fb89420d7b6e7f055
          git fetch --no-tags origin "$base"
          git checkout --detach "$base"
          deno fmt LANGUAGE.md spec/STAGING.md
          python3 - <<'PY'
          import pathlib, subprocess
          base = '5f6457b759a2faf888978c1fb89420d7b6e7f055'
          expected = {'LANGUAGE.md', 'spec/STAGING.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          for name in sorted(changed):
              before = subprocess.check_output(['git', 'show', f'{base}:{name}'], text=True)
              after = pathlib.Path(name).read_text()
              assert before.split() == after.split(), name
          PY
          deno fmt --check
          deno lint
          git diff --check
          git diff --binary > "$RUNNER_TEMP/pr170-formatting.patch"
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add LANGUAGE.md spec/STAGING.md
          git commit -m 'fix: canonical Markdown formatting for PR 170 CI'
          git push origin HEAD:refs/heads/workbench/pr170-ci-candidate-20260917
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat "$base" HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr170-formatting-repair
          path: ${{ runner.temp }}/pr170-formatting.patch
          if-no-files-found: warn
          retention-days: 3
