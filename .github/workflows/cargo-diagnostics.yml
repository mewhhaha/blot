name: Cargo diagnostics

on:
  push:
    branches:
      - codex/source-defined-operators-diagnostics

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Capture compiler tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path compiler/Cargo.toml --no-fail-fast 2>&1 | tee cargo-test.log
          echo "${PIPESTATUS[0]}" > cargo-test.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-test-output
          path: |
            cargo-test.log
            cargo-test.status
          if-no-files-found: error
