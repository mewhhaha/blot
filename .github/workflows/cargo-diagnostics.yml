name: Cargo diagnostics

on:
  push:
    branches:
      - codex/source-defined-operators-diagnostics

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Instrument export type mismatch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("compiler/src/hir.rs")
          source = path.read_text()
          old = '''            return Err(hir_error(
                          "A function export result does not match its checked type.",
                      ));'''
          new = '''            let message = format!(
                          "A function export `{name}` result does not match its checked type: actual {} {:?}; expected {} {:?}.",
                          result.type_id,
                          self.types[result.type_id],
                          expected,
                          self.types[expected],
                      );
                      return Err(hir_error(&message));'''
          if old not in source:
              raise SystemExit("export mismatch diagnostic anchor not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Capture failing compiler test
        shell: bash
        run: |
          set +e
          RUST_BACKTRACE=1 cargo test \
            --manifest-path compiler/Cargo.toml \
            session::tests::runtime_memory_lowering_fixture_prepares_and_emits_all_builders \
            -- --exact --nocapture \
            2>&1 | tee cargo-test.log
          echo "${PIPESTATUS[0]}" > cargo-test.status
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-test-output
          path: |
            cargo-test.log
            cargo-test.status
          if-no-files-found: error
