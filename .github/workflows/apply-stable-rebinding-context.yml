name: Apply stable rebinding context fix

on:
  push:
    branches:
      - fix/stable-rebinding-context

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-rebinding-context
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply patch
        run: python .github/apply-stable-rebinding-context.py
      - name: Format and test
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path compiler/Cargo.toml
          git diff --check
          cargo test --manifest-path compiler/Cargo.toml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/apply-stable-rebinding-context.py
          rm .github/workflows/apply-stable-rebinding-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve stable types across loop rebindings"
          git push origin HEAD:fix/stable-rebinding-context
