name: do-blocks-artifact-refresh

on:
  push:
    branches:
      - agent/do-blocks-ci

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks-artifact-fix
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Rebuild checked-in Rust-middle artifact
        run: deno task build:rust-middle
      - name: Commit artifact refresh
        run: |
          git config user.name "Jacob Torrång"
          git config user.email "kopatheonlyone@hotmail.com"
          git add generated/rust-middle/compiler.wasm generated/rust-middle/prelude.snapshot
          git commit -m "build: refresh Rust compiler artifact"
          git push origin HEAD:do-blocks-artifact-fix
