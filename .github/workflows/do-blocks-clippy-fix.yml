name: do-blocks-clippy-fix

on:
  push:
    branches:
      - agent/do-blocks-ci

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks-artifact-fix
          fetch-depth: 0
      - name: Remove redundant wildcard field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('experiments/rust-middle/src/eval.rs')
          text = p.read_text()
          needle = '            result_effects: _,\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected one redundant field, found {text.count(needle)}')
          p.write_text(text.replace(needle, '', 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "Jacob Torrång"
          git config user.email "kopatheonlyone@hotmail.com"
          git add experiments/rust-middle/src/eval.rs
          git commit -m "rust: satisfy current clippy"
          git push origin HEAD:do-blocks-artifact-fix
