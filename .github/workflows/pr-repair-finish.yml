name: Guarded PR106 integration repair

on:
  push:
    branches:
      - repair/pr-integration-20260906
    paths:
      - .github/workflows/pr-repair-finish.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/repair/pr-integration-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/review-implementation-20260906
          fetch-depth: 0
      - name: Verify reviewed source and merge the exact updated base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '27241dee329a5e12cda5a7fa7a0d998c6271d18d'
          test "$(git rev-parse origin/main)" = '2ce7c417a6f3fa8c953054f4bdfb13dcba5dcd8b'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 2ce7c417a6f3fa8c953054f4bdfb13dcba5dcd8b
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: pnpm install --frozen-lockfile
      - name: Reproduce the locally verified formatting and metadata tree
        shell: bash
        run: |
          set -euo pipefail
          deno fmt
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          deno fmt
          deno run --allow-read scripts/generate_language_health.ts --check
          deno lint
          git add -u
          git diff --cached --check
          test "$(git write-tree)" = '782ba824b1ee77e847a4ae958226e3ce938252b2'
          git commit -m 'Integrate merged performance fixes and restore formatting and diagnostic metadata'
          git push origin HEAD:codex/review-implementation-20260906
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
