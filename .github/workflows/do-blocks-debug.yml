name: do-blocks-debug

on:
  push:
    branches:
      - agent/do-blocks-worker

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/do-blocks-debug
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Dump do block CST
        run: |
          cat > .worker-cst.ts <<'TS'
          import { CpuFrontend } from "@mewhhaha/baba/runtime/webgpu";
          import { elaborateLayout } from "./src/syntax/layout.ts";
          import { ingestCpuSource } from "./src/syntax/parse.ts";
          import { materializeCpuCst } from "./src/syntax/cpu_cst.ts";
          import type { Rule, TokenCursor } from "./src/syntax/lower.ts";

          const source = `let value = do:\n  let local = 1\n  return local\nreturn value\n`;
          const layout = await elaborateLayout(source);
          if (!layout.ok) throw new Error(JSON.stringify(layout.diagnostics));
          console.log("LAYOUT", JSON.stringify(layout.layout.source));
          const frontend = CpuFrontend.create(await Deno.readFile("generated/wasm/parser.plan"));
          const parsed = ingestCpuSource(frontend, layout.layout.source);
          if (!parsed.ok) throw new Error(JSON.stringify(parsed.diagnostics));
          const root = materializeCpuCst(
            frontend,
            parsed.program,
            layout.layout.source,
            layout.layout.originalOffset,
          );
          type Cursor = Rule | TokenCursor;
          function dump(cursor: Cursor, depth = 0): void {
            const pad = "  ".repeat(depth);
            if (cursor.type === "token") {
              console.log(`${pad}TOKEN ${cursor.kind} ${JSON.stringify(cursor.text)}`);
              return;
            }
            console.log(`${pad}RULE ${cursor.name}`);
            for (const child of cursor.children()) dump(child, depth + 1);
          }
          dump(root);
          TS
          deno run --allow-read .worker-cst.ts
