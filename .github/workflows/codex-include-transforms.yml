name: Codex include transform validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - name: Build the compiler artifact used by the source tests
        run: pnpm compiler:build
      - name: Run the changed executable examples
        run: deno test --allow-read --filter='including|shader_metadata' examples.test.ts
      - name: Run the emitted-Wasm regression
        run: pnpm exec tsx --test src/compiler/include_projection.test.ts
