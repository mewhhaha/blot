name: Validate aggregate compiler repair

on:
  pull_request:
    paths:
      - .github/workflows/repair-pr143.yml
      - repair/staging/pr143-code.patch
      - repair/staging/pr143-examples.patch

permissions:
  contents: read

concurrency:
  group: repair-pr143-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'mewhhaha/blot' && github.event.pull_request.head.repo.full_name == 'mewhhaha/blot' && github.event.pull_request.head.ref == 'repair/pr143-compiler-workbench-20260915'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: dbcfc3ce9fcaa8477c459bbb208a2d0aa7ae8e1e
          path: candidate
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Apply the inspected repair to the original PR and green foundation
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Blot compiler repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git hash-object ../control/repair/staging/pr143-code.patch)" = 44ad602a6b8d7439d2be4199bff9af9d176b04ce
          test "$(git hash-object ../control/repair/staging/pr143-examples.patch)" = 00544acbcc2ef965e33920800c6b5ed7c99e100e
          git merge --no-edit e4719095634518a23b2acb2c24030cfad8b90307
          git apply --check ../control/repair/staging/pr143-code.patch ../control/repair/staging/pr143-examples.patch
          git apply ../control/repair/staging/pr143-code.patch ../control/repair/staging/pr143-examples.patch
          pnpm install --frozen-lockfile
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          cargo fmt --manifest-path compiler/Cargo.toml -- --check
          deno fmt --check
          deno lint
          git diff --check
      - name: Rebuild the exact Rust/Wasm compiler
        working-directory: candidate
        run: pnpm compiler:build
      - name: Test the native compiler without weakening its gates
        working-directory: candidate
        run: |
          cargo clippy --manifest-path compiler/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
          cargo test --manifest-path compiler/Cargo.toml
      - name: Qualify every registered abstraction and positive aggregate regression
        working-directory: candidate
        run: |
          node scripts/check_abstractions.mjs
          node --import tsx src/node/cli.ts lint --check examples/lib/event_aggregate.blot examples/composable_event_aggregates.blot
          deno run --allow-read scripts/generate_language_health.ts --check
      - name: Publish only an isolated validated candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add LANGUAGE.md spec/TYPECHECKING.md compiler/src/hir.rs compiler/src/runtime_signature.rs compiler/src/session.rs compiler/src/typecheck.rs examples/composable_event_aggregates.blot examples/composable_event_aggregates.md src/node/composable_event_aggregates.test.ts src/node/fixtures/higher_order_numeric_context.blot generated/language-health.json generated/compiler/prelude.snapshot
          git diff --cached --check
          git commit -m 'fix: preserve aggregate result carriers and caller diagnostics without repeated signatures'
          branch="repair/validated-pr143-${GITHUB_SHA:0:12}"
          git push origin "HEAD:refs/heads/$branch"
          mkdir -p ../result
          git branch validated-aggregate HEAD
          git bundle create ../result/pr143.bundle refs/heads/validated-aggregate
          git bundle verify ../result/pr143.bundle
          cp generated/compiler/compiler.wasm generated/compiler/compiler-artifact.json generated/compiler/prelude.snapshot ../result/
          printf '{"commit":"%s","tree":"%s","branch":"%s","foundation":"e4719095634518a23b2acb2c24030cfad8b90307"}\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$branch" > ../result/candidate.json
          cat ../result/candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: validated-pr143-${{ github.event.pull_request.head.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 7
