name: Apply static product layout fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/source-defined-include-transforms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/source-defined-include-transforms
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - name: Match static product memory fields by name
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("compiler/src/backend.rs")
          source = path.read_text()
          pattern = re.compile(
              r"(?P<indent>\s*)for \(\(field, operand\), memory_field\) in fields\n"
              r"\s*\.iter\(\)\n"
              r"\s*\.zip\(&operation\.operands\)\n"
              r"\s*\.zip\(record_layout\(&memory_fields\)\)\n"
              r"\s*\{\n"
              r"\s*if field\.name != memory_field\.name \{\n"
              r"\s*return Err\(format!\(\n"
              r"\s*\"\{\}: static product field `\{\}` maps to `\{\}`\",\n"
              r"\s*self\.module\.source, field\.name, memory_field\.name\n"
              r"\s*\)\);\n"
              r"\s*\}\n",
          )
          match = pattern.search(source)
          if match is None:
              raise SystemExit("static product write block did not match")
          indent = match.group("indent")
          continuation = indent + "    "
          replacement = (
              f"{indent}let memory_fields = record_layout(&memory_fields)\n"
              f"{continuation}.into_iter()\n"
              f"{continuation}.map(|field| (field.name.clone(), field))\n"
              f"{continuation}.collect::<BTreeMap<_, _>>();\n"
              f"{indent}for (field, operand) in fields.iter().zip(&operation.operands) {{\n"
              f"{continuation}let memory_field = memory_fields.get(&field.name).ok_or_else(|| {{\n"
              f"{continuation}    format!(\n"
              f"{continuation}        \"{{}}: static product field `{{}}` has no record layout\",\n"
              f"{continuation}        self.module.source, field.name\n"
              f"{continuation}    )\n"
              f"{continuation}}})?;\n"
          )
          path.write_text(source[: match.start()] + replacement + source[match.end() :])
          PY
      - name: Format and run compiler tests
        run: |
          cargo fmt --manifest-path compiler/Cargo.toml --all
          cargo test --manifest-path compiler/Cargo.toml
      - name: Build compiler and run static product regression
        run: |
          pnpm compiler:build
          pnpm exec tsx --test src/compiler/static_product_layout.test.ts
      - name: Commit validated fix and remove this one-shot workflow
        run: |
          rm .github/workflows/codex-static-product-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/backend.rs src/compiler/static_product_layout.test.ts .github/workflows/codex-static-product-fix.yml
          git commit -m "Match static product memory fields by name"
          git push origin HEAD:codex/source-defined-include-transforms
