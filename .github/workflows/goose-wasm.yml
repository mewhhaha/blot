name: Goose WebAssembly compiler

on:
  pull_request:
    paths:
      - tools/goose-wasm/**
      - .github/workflows/goose-wasm.yml
  push:
    branches: [main]
    paths:
      - tools/goose-wasm/**
      - .github/workflows/goose-wasm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goose-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMCC_CORES: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - name: Install native build tools
        run: python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Build pinned Goose compiler and checked runtime
        run: python3 tools/goose-wasm/bootstrap.py --generator Ninja
      - name: Install pinned Emscripten
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/emscripten-core/emsdk.git build/emsdk
          git -C build/emsdk checkout d7b4130688bfa348392b921ab04015aa15c4f154
          build/emsdk/emsdk install 6.0.13
          build/emsdk/emsdk activate 6.0.13
          echo "$PWD/build/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EM_CONFIG=$PWD/build/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "EM_CACHE=$PWD/build/emscripten-cache" >> "$GITHUB_ENV"
      - name: Check target refusals and driver behavior
        run: |
          python3 tools/goose-wasm/tests/test_target.py
          python3 tools/goose-wasm/tests/test_driver.py
      - name: Qualify full wasm32 corpus against native Goose
        run: python3 tools/goose-wasm/tests/run_tests.py --full
      - name: Qualify memory64 output
        run: >-
          python3 tools/goose-wasm/tests/run_tests.py --quick --memory64
          --output-dir build/goose-wasm/memory64-results
      - name: Build distributable example
        run: >-
          python3 tools/goose-wasm/goose_wasm.py build
          tools/goose-wasm/examples/stable_tree.goose
          -o build/goose-wasm/example/stable-tree.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
      - name: Qualify minimum Node version
        run: >-
          python3 tools/goose-wasm/tests/run_tests.py --quick
          --output-dir build/goose-wasm/node22-results
      - name: Package compiler with patched source and notices
        shell: bash
        run: |
          set -euo pipefail
          tar -czf build/goose-wasm-linux-x64.tar.gz \
            --exclude='build/goose-wasm/source/.git' \
            --exclude='*/__pycache__' \
            tools/goose-wasm LICENSE \
            build/goose-wasm/bin build/goose-wasm/source \
            build/goose-wasm/source.json build/goose-wasm/toolchain.json \
            build/goose-wasm/example
      - uses: actions/upload-artifact@v7
        with:
          name: goose-wasm-linux-x64
          path: build/goose-wasm-linux-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: goose-wasm-qualification
          path: |
            build/goose-wasm/test-results/**/*.json
            build/goose-wasm/test-results/**/*.stdout
            build/goose-wasm/test-results/**/*.stderr
            build/goose-wasm/memory64-results/**/*.json
            build/goose-wasm/memory64-results/**/*.stdout
            build/goose-wasm/memory64-results/**/*.stderr
            build/goose-wasm/node22-results/**/*.json
            build/goose-wasm/node22-results/**/*.stdout
            build/goose-wasm/node22-results/**/*.stderr
          if-no-files-found: warn
