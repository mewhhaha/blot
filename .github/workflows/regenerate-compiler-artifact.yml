name: Regenerate compiler artifact

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'codex/compdo-effect-rows-no-elements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compdo-effect-rows-no-elements
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build compiler artifact
        run: deno task build:compiler
      - name: Commit artifact and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/compiler/compiler.wasm generated/compiler/prelude.snapshot
          git rm .github/workflows/regenerate-compiler-artifact.yml
          git commit -m "Regenerate compiler artifact"
          git push origin HEAD:codex/compdo-effect-rows-no-elements
