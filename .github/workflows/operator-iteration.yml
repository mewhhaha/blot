name: Apply draft operator iteration

on:
  push:
    branches:
      - codex/complete-operator-dispatch-20260905
    paths:
      - scripts/operator-iteration.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'mewhhaha/blot' && github.ref == 'refs/heads/codex/complete-operator-dispatch-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Apply the exact reviewed patch on this draft branch
        shell: bash
        run: |
          base64 --decode scripts/operator-iteration.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/operator-iteration.patch"
          git apply --index --whitespace=error "$RUNNER_TEMP/operator-iteration.patch"
          git rm scripts/operator-iteration.patch.gz.b64
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve qualified member constraints through inference and module boundaries'
          git push origin HEAD:refs/heads/codex/complete-operator-dispatch-20260905
