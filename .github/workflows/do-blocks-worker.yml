name: do-blocks-worker

on:
  push:
    branches:
      - agent/do-blocks-worker

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-handlers-and-if
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Implement explicit do blocks
        run: |
          git checkout -B do-blocks origin/simplify-handlers-and-if
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrences, found {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          # Grammar: `do:` is the only explicit statement scope expression.
          edit('grammar.baba',
               '  | case_expression\n  | handler_composition\n  | array\n',
               '  | case_expression\n  | handler_composition\n  | do_block\n  | array\n', 1)
          edit('grammar.baba',
               '  | "for" | "in" | "break" | "try" | "with" | "fn"\n',
               '  | "for" | "in" | "break" | "try" | "with" | "do" | "fn"\n', 1)
          edit('grammar.baba',
               '  | handler_composition\n  | block\n  | array\n',
               '  | handler_composition\n  | do_block\n  | block\n  | array\n', 1)
          edit('grammar.baba',
               '  | handler_composition\n  | block\n  | array\n  | parenthesized_or_tuple\n) ;\n\n// A lambda',
               '  | handler_composition\n  | do_block\n  | block\n  | array\n  | parenthesized_or_tuple\n) ;\n\n// A lambda', 1)
          edit('grammar.baba',
               '// A block normally produces `()`. `return value` is a statement, so it can\n// leave the block from a nested statement branch without making a bare tail\n// expression compete with `name := value;` on IDENT.\nblock = (\n  LAYOUT_NEWLINE\n  LAYOUT_INDENT\n  statements:statement*\n  LAYOUT_DEDENT\n) ;\n',
               '// Construct-owned suites lower through this internal block form. It has no\n// opening source token of its own.\nblock = (\n  LAYOUT_NEWLINE\n  LAYOUT_INDENT\n  statements:statement*\n  LAYOUT_DEDENT\n) ;\n\n// `do:` is the explicit statement scope available as a value. It deliberately\n// has a lexical introducer; parentheses remain grouping/tuple syntax only.\ndo_block = (\n  "do"\n  ":"\n  LAYOUT_NEWLINE\n  LAYOUT_INDENT\n  statements:statement*\n  LAYOUT_DEDENT\n) ;\n', 1)

          # Layout no longer guesses that a parenthesis opens a statement suite.
          p = Path('src/syntax/layout.ts')
          text = p.read_text()
          text = text.replace(
              '    const suiteIntroducer = opensSuite(previous, elementSuiteIntroducers) ||\n      opensParenthesizedSuite(previous, token, tokens[tokenIndex + 1]);',
              '    const suiteIntroducer = opensSuite(previous, elementSuiteIntroducers);',
              1,
          )
          text, n = re.subn(
              r'\nfunction opensParenthesizedSuite\([\s\S]*?\n}\n\nfunction ',
              '\nfunction ',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('layout.ts: opensParenthesizedSuite function not found')
          p.write_text(text)

          # The new surface rule is erased to the existing AST block.
          edit('src/syntax/lower.ts',
               '  if (rule.name === "block") {\n',
               '  if (rule.name === "block" || rule.name === "do_block") {\n', 1)
          edit('src/syntax/compact_schema.ts',
               '  "block.statements",\n',
               '  "block.statements",\n  "do_block.statements",\n', 1)

          # Formatter treats explicit do scopes as value-scope boundaries while
          # retaining their own opening line (unlike implicit block suites).
          edit('src/tooling/formatter.ts',
               '  "block",\n  "case_expression",\n',
               '  "block",\n  "do_block",\n  "case_expression",\n', 1)
          edit('src/tooling/formatter.ts',
               'const blockRule = new Set(["block"]);',
               'const blockRule = new Set(["block", "do_block"]);', 1)
          edit('src/tooling/formatter.ts',
               'const valueScopeBoundaryRules = new Set([\n  "block",\n',
               'const valueScopeBoundaryRules = new Set([\n  "block",\n  "do_block",\n', 1)
          # Add to INDENTED_RULES, which has a second block occurrence after array_pattern.
          marker = '  "array_pattern",\n  "block",\n'
          edit('src/tooling/formatter.ts', marker,
               '  "array_pattern",\n  "block",\n  "do_block",\n', 1)
          p = Path('src/tooling/formatter.ts')
          text = p.read_text()
          text = text.replace(
              'return expressionPrimaryIs(expression, "block");',
              'return expressionPrimaryIs(expression, "block") ||\n    expressionPrimaryIs(expression, "do_block");',
          )
          text = text.replace(
              'return primary.name === "block";',
              'return primary.name === "block" || primary.name === "do_block";',
          )
          p.write_text(text)

          # Migrate the actual source uses of the old parenthesized statement scope.
          edit('src/prelude/prelude.blot',
               '''const U = fn bits => (\n  let width = integer_width bits\n  return range (0, @int.sub (pow2 width) 1) <+ { .bit_width = width; }\n)''',
               '''const U = fn bits => do:\n  let width = integer_width bits\n  return range (0, @int.sub (pow2 width) 1) <+ { .bit_width = width; }''', 1)
          edit('src/prelude/prelude.blot',
               '''const I = fn bits => (\n  let width = integer_width bits\n  let magnitude = pow2 (@int.sub width 1)\n  return range (\n    @int.neg magnitude,\n    @int.sub magnitude 1\n  ) <+ { .bit_width = width; }\n)''',
               '''const I = fn bits => do:\n  let width = integer_width bits\n  let magnitude = pow2 (@int.sub width 1)\n  return range (\n    @int.neg magnitude,\n    @int.sub magnitude 1\n  ) <+ { .bit_width = width; }''', 1)
          p = Path('src/prelude/prelude.blot')
          text = p.read_text()
          old = 'const layout = fn (shape, width_of) => (\n'
          if old not in text:
              raise SystemExit('prelude layout parenthesized block not found')
          start = text.index(old)
          body_start = start + len(old)
          # This helper is followed by the next blank line + declaration; its old
          # scope-closing parenthesis is the line immediately before that boundary.
          boundary = text.index('\n\n', body_start)
          while boundary > body_start and text[boundary-2:boundary] != '\n)':
              boundary = text.index('\n\n', boundary + 2)
          segment = text[start:boundary]
          if not segment.endswith('\n)'):
              raise SystemExit('prelude layout closing block parenthesis not found')
          replacement = segment.replace(old, 'const layout = fn (shape, width_of) => do:\n', 1)[:-2]
          p.write_text(text[:start] + replacement + text[boundary:])

          edit('inference.test.ts',
               '''`return (\n  let up = rec (fn n => if n == 0 : 0 else: down (n - 1))\n  let down = rec (fn n => if n == 0 : 1 else: up (n - 1))\n  return up 9\n)\n`,''',
               '''`return do:\n  let up = rec (fn n => if n == 0 : 0 else: down (n - 1))\n  let down = rec (fn n => if n == 0 : 1 else: up (n - 1))\n  return up 9\n`,''', 1)

          # Normative docs: parentheses never establish statement scope.
          edit('LANGUAGE.md',
               'for in break try fn\n',
               'for in break try do fn\n', 1)
          edit('LANGUAGE.md',
               'The\nintroducers are `=`, `=>`, `<-`, `of`, `with`, `:`, and an opening element\'s\n`>`. An opening `(` also introduces an explicit block when its next physical\nline starts with a statement form.',
               'The\nintroducers are `=`, `=>`, `<-`, `of`, `with`, `:`, and an opening element\'s\n`>`. `do:` is the explicit value-producing statement scope. Parentheses only\ngroup values or form tuples; they never introduce a statement suite.', 1)
          edit('LANGUAGE.md', '### 4.8 Return\n', '### 4.8 Explicit blocks and return\n', 1)
          edit('LANGUAGE.md',
               '```blot\nreturn value\n\nreturn\n  value\n```\n\nThe value may follow `return` on the same line or in an indented continuation.\n`return` exits the nearest enclosing module or explicit indentation block with\nthat value.',
               '```blot\nlet value = do:\n  let local = 1\n  return local\n\nreturn value\n\nreturn\n  value\n```\n\n`do:` introduces a lexical scope whose ordinary fallthrough value is `()`. A\n`return` inside it supplies the block value. The value may follow `return` on\nthe same line or in an indented continuation. `return` exits the nearest\nenclosing module or explicit `do` block with that value.', 1)

          # Focused parser/lowering coverage and executable catalog entries.
          p = Path('src/syntax/surface.test.ts')
          text = p.read_text()
          insertion = '''\nDeno.test("do is an explicit value-producing statement scope", async () => {\n  const source = `let value = do:\n  let local = 1\n  return local\nreturn value\n`;\n  const parsed = await parse(source);\n  assert(parsed.ok);\n  if (!parsed.ok) return;\n  const binding = parsed.module.declarations[0];\n  assert(binding !== undefined && binding.tag === "binding");\n  if (binding === undefined || binding.tag !== "binding") return;\n  assertEquals(binding.value.tag, "block");\n  if (binding.value.tag !== "block") return;\n  assertEquals(binding.value.declarations.length, 1);\n  assertEquals(binding.value.result.tag, "var");\n});\n'''
          anchor = '\nDeno.test(\n  "two-argument @handle elaborates to a computation transformer",'
          if anchor not in text:
              raise SystemExit('surface test anchor not found')
          p.write_text(text.replace(anchor, insertion + anchor, 1))

          Path('examples/do_blocks.blot').write_text('''let value = do:\n  let a = 1\n  let b = 2\n  return a\n\nreturn value\n''')
          Path('examples/expected/do_blocks.txt').write_text('1\n')
          Path('examples/rejected/syntax/parenthesized_block.blot').write_text('''let value = (\n  let local = 1\n  return local\n)\nreturn value\n''')
          PY
      - name: Generate parser
        run: deno task generate
      - name: Generate Rust middle schema
        run: deno task generate:rust-middle-schema
      - name: Format changes
        run: deno fmt
      - name: Run focused tests
        run: deno test --allow-read --allow-write src/syntax/layout.test.ts src/syntax/surface.test.ts syntax.test.ts examples.test.ts inference.test.ts
      - name: Inspect parser profile
        run: deno task inspect
      - name: Commit and push branch
        run: |
          git config user.name "Jacob Torrång"
          git config user.email "kopatheonlyone@hotmail.com"
          git add -A
          git commit -m "language: add explicit do blocks"
          git push --force-with-lease origin HEAD:do-blocks
