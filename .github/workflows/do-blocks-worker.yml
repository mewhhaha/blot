name: do-blocks-worker

on:
  push:
    branches:
      - agent/do-blocks-worker

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-handlers-and-if
          fetch-depth: 0
      - name: Show parenthesized statement block contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r'\(\r?\n(?=[ \t]+(?:let|const|sig|return|for|break|open|<-|[A-Za-z_][A-Za-z0-9_]*[ \t]*(?:<-|:=))\b)')
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts or 'generated' in path.parts:
                  continue
              if path.suffix not in {'.blot', '.ts', '.md', '.baba'}:
                  continue
              try: text = path.read_text()
              except UnicodeDecodeError: continue
              lines = text.splitlines()
              for m in pattern.finditer(text):
                  line = text.count('\n', 0, m.start())
                  print(f'--- {path}:{line + 1} ---')
                  for i in range(max(0, line - 1), min(len(lines), line + 8)):
                      print(f'{i+1:5}: {lines[i]}')
          PY
