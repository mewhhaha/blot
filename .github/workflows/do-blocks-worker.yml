name: do-blocks-worker

on:
  push:
    branches:
      - agent/do-blocks-worker

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks
          fetch-depth: 0
      - name: Inspect block lowering and tests
        run: |
          echo '--- lower.ts block contexts ---'
          rg -n -C 5 'block' src/syntax/lower.ts | head -n 180
          echo '--- syntax tests block contexts ---'
          rg -n -C 4 'block|parenthes' src/syntax/*.test.ts syntax.test.ts | head -n 240
