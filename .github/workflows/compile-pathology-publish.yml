name: Publish inspected compilation increment
on:
  push:
    branches: [workbench/compile-pathology-publish-20260917]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f5cafbf3ff12928f85c309fbe9623ace783b2a0a
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Apply canonical documentation formatting without semantic changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object compiler/src/residual_identity.rs)" = 78c2d5ae148c270801e4b1a14dfcf791f2dc0a55
          deno fmt spec/STAGING.md experiments/compiler-bench/complete-compilation/README.md
          test "$(git hash-object spec/STAGING.md)" = 7bf7df3cf93fc72ff0c795354fe4a7415b0bd285
          git diff --check
          git add spec/STAGING.md experiments/compiler-bench/complete-compilation/README.md
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git commit -m 'style: apply canonical formatting to compilation investigation'
          git diff --exit-code f5cafbf3ff12928f85c309fbe9623ace783b2a0a HEAD -- compiler src generated .github
          git push origin HEAD:refs/heads/workbench/compile-pathology-v1-formatted-20260917
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
