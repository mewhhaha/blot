name: Compiler repair workbench

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compiler-repair-workbench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'mewhhaha/blot' && github.event.pull_request.head.repo.full_name == 'mewhhaha/blot' && github.event.pull_request.head.ref == 'repair/pr143-compiler-workbench-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Integrate the inspected main revision locally
        run: |
          set -euo pipefail
          git config user.name 'Blot compiler repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit bd57a8211daede2c299892b6f7b6deb8793f81af
          deno fmt LANGUAGE.md spec/STAGING.md
          git add LANGUAGE.md spec/STAGING.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: restore main specification formatting'
          fi
          git status --porcelain
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --manifest-path compiler/Cargo.toml --locked
      - run: pnpm compiler:build
      - name: Verify generated snapshot
        run: git diff --exit-code -- generated/compiler/prelude.snapshot
      - name: Pack exact source and compiler workspace
        run: |
          set -euo pipefail
          git bundle create source.bundle HEAD
          {
            git ls-files -z
            printf 'source.bundle\0generated/compiler/compiler.wasm\0generated/compiler/compiler-artifact.json\0.pnp.cjs\0node_modules\0'
          } > "$RUNNER_TEMP/repair-workspace.files"
          tar --create --gzip --file=repair-workspace.tar.gz --null --files-from="$RUNNER_TEMP/repair-workspace.files"
      - uses: actions/upload-artifact@v7
        with:
          name: repair-workspace-${{ github.event.pull_request.head.sha }}
          path: repair-workspace.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Pack pinned offline build tools and dependency caches
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/offline-tools"
          mkdir -p "$tools"
          cp -a "$(rustc --print sysroot)" "$tools/rust"
          cp "$(command -v deno)" "$tools/deno"
          cp "$(command -v node)" "$tools/node"
          cp -a "$CARGO_HOME/registry" "$tools/cargo-registry"
          deno_dir="$(deno info --json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>console.log(JSON.parse(s).denoDir));')"
          cp -a "$deno_dir" "$tools/deno-cache"
          tar --create --gzip --file=offline-tools.tar.gz -C "$tools" .
      - uses: actions/upload-artifact@v7
        with:
          name: repair-offline-tools-${{ github.event.pull_request.head.sha }}
          path: offline-tools.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Reproduce and qualify the unmodified aggregate implementation
        run: |
          node --import tsx src/node/cli.ts check src/node/fixtures/event_aggregate_unannotated_right.blot
          node --import tsx --test src/node/composable_event_aggregates.test.ts
