name: PR 107 root cause
on:
  push:
    branches:
      - maintenance/pr107-root-cause-20260907
permissions:
  contents: read
concurrency:
  group: pr107-root-cause
  cancel-in-progress: true
jobs:
  candidate-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2242a54cee677814554d8c55a79272211441bfaa
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Verify source identity and review changes
        run: |
          test "$(git rev-parse HEAD)" = 2242a54cee677814554d8c55a79272211441bfaa
          test "$(git rev-parse HEAD^{tree})" = 83fc5c8cc63cfefc3567677d8820910e700661ae
          git diff HEAD^ HEAD -- compiler/src/eval.rs compiler/src/hir.rs compiler/src/lower.rs compiler/src/backend.rs
      - name: Full native suite including engine, without exclusions
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr107-evidence
          /usr/bin/time -v cargo test --manifest-path compiler/Cargo.toml -- --nocapture > /tmp/pr107-evidence/native.log 2>&1
          cat /tmp/pr107-evidence/native.log
      - name: Print failure evidence
        if: failure()
        run: tail -n 250 /tmp/pr107-evidence/native.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr107-candidate-native
          path: /tmp/pr107-evidence
          if-no-files-found: error
          retention-days: 3
  baseline-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7705a8a4693e553a3967772b21479d45f2819c13
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install debugger
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Build native tests
        run: cargo test --manifest-path compiler/Cargo.toml --no-run --message-format=json > /tmp/pr107-build.json
      - name: Sample baseline engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr107-evidence
          sudo sysctl -w kernel.yama.ptrace_scope=0
          python3 - <<'PY'
          import json, os, pathlib, signal, subprocess, time
          items = [json.loads(line) for line in pathlib.Path('/tmp/pr107-build.json').read_text().splitlines()]
          binary = next(item['executable'] for item in items if item.get('reason') == 'compiler-artifact' and item.get('profile', {}).get('test') and '/deps/blot_compiler-' in (item.get('executable') or ''))
          with open('/tmp/pr107-evidence/engine.log', 'w') as out:
              process = subprocess.Popen([binary, 'session::tests::engine_entry_points_prepare_and_the_game_loop_emits_wasm', '--exact', '--nocapture'], stdout=out, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  for index in range(3):
                      time.sleep(10)
                      if process.poll() is not None:
                          print('ENGINE EXIT', process.returncode, flush=True)
                          break
                      sample = subprocess.run(['sudo', 'gdb', '-q', '-batch', '-p', str(process.pid), '-ex', 'set pagination off', '-ex', 'thread apply all bt 35'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=30)
                      if sample.returncode:
                          raise RuntimeError(sample.stdout)
                      pathlib.Path(f'/tmp/pr107-evidence/stack-{index}.txt').write_text(sample.stdout)
                      print(f'ENGINE STACK {index}\n{sample.stdout}', flush=True)
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
          print(pathlib.Path('/tmp/pr107-evidence/engine.log').read_text(), flush=True)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr107-baseline-profile
          path: /tmp/pr107-evidence
          if-no-files-found: error
          retention-days: 3
