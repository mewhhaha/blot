name: PR 107 root cause
on:
  push:
    branches:
      - maintenance/pr107-root-cause-20260907
permissions:
  contents: read
concurrency:
  group: pr107-root-cause
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Index relevant source and prior repair history
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -E 'fn .*qualified|fn .*residual.*signature|fn .*expression.*(metadata|type)|no settled function signature|engine_entry_points_prepare' -- compiler/src || true
          git log --all --format='%h %s' --grep='signature\|qualified\|engine\|staging' -45
      - name: Build native tests
        run: cargo test --manifest-path compiler/Cargo.toml --no-run --message-format=json > /tmp/pr107-build.json
      - name: Reproduce failures and sample the engine stall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr107-evidence
          python3 - <<'PY'
          import json, os, pathlib, signal, subprocess, time
          binaries = [json.loads(line)['executable'] for line in pathlib.Path('/tmp/pr107-build.json').read_text().splitlines() if json.loads(line).get('reason') == 'compiler-artifact' and json.loads(line).get('profile', {}).get('test') and json.loads(line).get('executable')]
          binary = next(path for path in binaries if '/deps/blot_compiler-' in path)
          engine = 'session::tests::engine_entry_points_prepare_and_the_game_loop_emits_wasm'
          log = pathlib.Path('/tmp/pr107-evidence/native.log')
          with log.open('w') as out:
              result = subprocess.run([binary, '--skip', engine, '--nocapture'], stdout=out, stderr=subprocess.STDOUT, timeout=120)
          print('NON-ENGINE EXIT', result.returncode, flush=True)
          text = log.read_text()
          print(text[text.find('failures:'):] if 'failures:' in text else text[-12000:], flush=True)
          subprocess.run(['sudo', 'sysctl', '-w', 'kernel.yama.ptrace_scope=0'], check=True)
          with open('/tmp/pr107-evidence/engine.log', 'w') as out:
              process = subprocess.Popen([binary, engine, '--exact', '--nocapture'], stdout=out, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  for index in range(3):
                      time.sleep(10)
                      if process.poll() is not None:
                          print('ENGINE EXIT', process.returncode, flush=True)
                          break
                      sample = subprocess.run(['sudo', 'gdb', '-q', '-batch', '-p', str(process.pid), '-ex', 'set pagination off', '-ex', 'thread apply all bt 24'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=30)
                      pathlib.Path(f'/tmp/pr107-evidence/stack-{index}.txt').write_text(sample.stdout)
                      print(f'ENGINE STACK {index}\n{sample.stdout}', flush=True)
              finally:
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
          print(pathlib.Path('/tmp/pr107-evidence/engine.log').read_text(), flush=True)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr107-root-cause-diagnostics
          path: /tmp/pr107-evidence
          if-no-files-found: error
          retention-days: 3
