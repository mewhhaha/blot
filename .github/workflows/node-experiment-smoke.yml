name: Node compilation experiment smoke test

on:
  push:
    branches:
      - codex/node-baba-gpupaper

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run node:compile
