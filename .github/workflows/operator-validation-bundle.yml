name: Package operator validation source

on:
  push:
    branches:
      - work/operator-lowering-validation-20260905
    paths:
      - .github/workflows/operator-validation-bundle.yml

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'mewhhaha/blot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact committed sources and history
        run: |
          git bundle create blot-repository.bundle --all
          git bundle verify blot-repository.bundle
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: blot-operator-source-bundle
          path: |
            blot-repository.bundle
            source-commit.txt
          retention-days: 7
          if-no-files-found: error
