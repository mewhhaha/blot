name: Confirm current loop regressions

on:
  push:
    branches:
      - codex/unify-rust-diagnose
    paths:
      - .github/workflows/loop-regression-current.yml

permissions:
  contents: read

jobs:
  loops:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: cargo test --manifest-path compiler/Cargo.toml a_rebound_loop_element_stays_local_to_each_iteration a_conditionally_rebound_loop_element_stays_local_to_each_iteration -- --test-threads=1 --nocapture
