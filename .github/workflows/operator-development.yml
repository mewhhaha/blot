name: Temporary operator development tools

on:
  push:
    branches:
      - codex/complete-operator-dispatch-20260905
    paths:
      - .github/workflows/operator-development.yml

permissions:
  contents: read

jobs:
  formatter-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Package the formatter executable without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/operator-format-tools"
          cp "$(command -v deno)" "$RUNNER_TEMP/operator-format-tools/deno"
          tar -C "$RUNNER_TEMP/operator-format-tools" -czf "$RUNNER_TEMP/operator-format-tools.tar.gz" deno
      - uses: actions/upload-artifact@v4
        with:
          name: operator-format-tools
          path: ${{ runner.temp }}/operator-format-tools.tar.gz
          retention-days: 1
          compression-level: 0
