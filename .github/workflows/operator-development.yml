name: Draft operator development validation

on:
  push:
    branches:
      - codex/complete-operator-dispatch-20260905
    paths:
      - .github/workflows/operator-development.yml
      - scripts/operator-next.py

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'mewhhaha/blot' && github.ref == 'refs/heads/codex/complete-operator-dispatch-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Apply and generate incremental source changes
        run: |
          if test -f scripts/operator-next.py; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/operator-next.py')
          s = p.read_text()
          if "section(h, 'runtime_type'" in s:
              s = s.replace('    if not match:\n', "    if name == 'runtime_type':\n        match = list(re.finditer(r'(?m)^([ \\t]*)fn runtime_type\\(', text))[-1]\n    if not match:\n")
              p.write_text(s)
          PY
            python3 scripts/operator-next.py
            rm scripts/operator-next.py
            deno task generate:qcore
            deno task generate:compiler-schema
            cargo fmt --manifest-path compiler/Cargo.toml
            deno fmt LANGUAGE.md spec/TYPECHECKING.md spec/QCORE.md qcore/schema.json
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git add compiler/src/*.rs
            git commit -m 'Preserve qualified member requirements across compiler boundaries'
            git push origin HEAD:refs/heads/codex/complete-operator-dispatch-20260905
          fi
      - name: Check compiler boundaries
        run: cargo check --manifest-path compiler/Cargo.toml --tests --message-format=short
      - name: Test the full Rust compiler
        run: cargo test --manifest-path compiler/Cargo.toml --quiet
      - name: Check Rust lint
        run: cargo clippy --manifest-path compiler/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Prepare an isolated reproduction workspace
        if: always()
        run: |
          mkdir -p /tmp/operator-repro
          git ls-files -z | tar --null --ignore-failed-read -T - -czf /tmp/operator-repro/source.tar.gz
          cargo fetch --manifest-path compiler/Cargo.toml
          tar -C "$HOME/.cargo" -czf /tmp/operator-repro/registry.tar.gz registry
          toolchain=$(rustc --print sysroot)
          tar -C "$toolchain" -czf /tmp/operator-repro/toolchain.tar.gz bin lib libexec
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-reproduction
          path: /tmp/operator-repro
          retention-days: 1
