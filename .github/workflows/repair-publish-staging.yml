name: Repair publish staging

on:
  pull_request:
    paths:
      - .github/workflows/repair-publish-staging.yml
      - repair/staging/pr153.patch
      - repair/staging/pr155.patch
      - repair/staging/pr159.patch

permissions:
  contents: read

jobs:
  reviewed-candidates:
    if: github.repository == 'mewhhaha/blot' && github.event.pull_request.head.repo.full_name == 'mewhhaha/blot' && github.event.pull_request.head.ref == 'repair/pr143-compiler-workbench-20260915'
    permissions:
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: pnpm install --frozen-lockfile
        working-directory: candidate
      - name: Stage exact locally tested source trees without changing PR refs
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Blot PR repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import concurrent.futures, gzip, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          control = root.parent / 'control'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'final-audit'
          out.mkdir(exist_ok=True)
          foundation = '7aed87f916aa35fcbaa2cbab7599a79fb1e470c8'
          candidates = [
              (153, 'd7a1612766aa3ab0cbfaba50bee35a7360a2f3e0', '61cdc7faf6fbae215df9346fe13fe0060ba36edc'),
              (155, '057bec5f8b35f81cacc1a04a89397062c276ad39', '45123912cccc7c8f08e950983ccdfbf5d9d2bd99'),
              (159, '4cff992fa02b7d540266f60fcc6c89ce4cbb0847', '209cf11bf203652655e5ae662bbbae32085e5415'),
          ]
          published = []
          def run(*args):
              subprocess.run(args, check=True)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          for number, old, expected in candidates:
              run('git', 'checkout', '--detach', old)
              if number != 159:
                  run('git', 'merge', '--no-commit', '--no-ff', foundation)
              else:
                  run('git', 'checkout', '95b25022ab9b263617c07deca424a7fb26bbbedc', '--',
                      'compiler/src/hir.rs', 'compiler/src/runtime_signature.rs',
                      'compiler/src/session.rs', 'compiler/src/typecheck.rs',
                      'generated/compiler/prelude.snapshot', 'spec/TYPECHECKING.md',
                      'examples/lib/event_aggregate.blot',
                      'src/node/fixtures/event_aggregate_unannotated_right.blot')
              run('git', 'apply', '--index', str(control / 'repair/staging' / f'pr{number}.patch'))
              run('deno', 'fmt')
              run('deno', 'lint')
              run('deno', 'run', '--allow-read', '--allow-write', 'scripts/generate_language_health.ts')
              run('deno', 'fmt', '--check')
              run('git', 'diff', '--check')
              run('git', 'add', '-u')
              tree = git('write-tree')
              if tree != expected:
                  raise RuntimeError(f'PR {number}: {tree} is not the locally validated tree {expected}')
              run('git', 'commit', '-m', f'fix: complete PR #{number} with checked implementations and strict regressions')
              head = git('rev-parse', 'HEAD')
              run('git', 'merge-base', '--is-ancestor', old, head)
              branch = f'repair/final-20260916/pr-{number}'
              run('git', 'push', 'origin', f'HEAD:refs/heads/{branch}')
              run('git', 'update-ref', f'refs/heads/final-audit/pr-{number}', head)
              published.append({'number': number, 'old': old, 'head': head, 'tree': tree, 'candidate_branch': branch})
              (out / 'candidates.json').write_text(json.dumps(published, indent=2) + '\n')
          run('git', 'bundle', 'create', str(out / 'candidates.bundle'), *[f'refs/heads/final-audit/pr-{p["number"]}' for p in published])
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          prs = api('repos/mewhhaha/blot/pulls?state=all&sort=created&direction=desc&per_page=100')
          (out / 'prs.json').write_text(json.dumps(prs, indent=2) + '\n')
          (out / 'main.json').write_text(json.dumps(api('repos/mewhhaha/blot/git/ref/heads/main'), indent=2) + '\n')
          def inspect(pr):
              number = pr['number']
              runs = api('repos/mewhhaha/blot/actions/runs?head_sha=' + pr['head']['sha'] + '&per_page=20')['workflow_runs']
              standard = [r for r in runs if r['name'] in ['CI source snapshot', 'Abstraction contracts', 'Rust/Wasm compiler CI']]
              for run in standard:
                  if run['conclusion'] != 'failure':
                      continue
                  jobs = api(run['jobs_url'])
                  (out / f'pr-{number}-jobs-{run["id"]}.json').write_text(json.dumps(jobs, indent=2) + '\n')
                  for job in jobs['jobs']:
                      if job['conclusion'] == 'failure':
                          try:
                              log = subprocess.check_output(['gh', 'api', '--allow-escape-sequences', 'repos/mewhhaha/blot/actions/jobs/' + str(job['id']) + '/logs'], stderr=subprocess.PIPE)
                              (out / f'pr-{number}-failure-{job["id"]}.log.gz').write_bytes(gzip.compress(log))
                          except subprocess.CalledProcessError:
                              pass
              return str(number), [{k: r.get(k) for k in ['id', 'name', 'status', 'conclusion', 'head_sha', 'html_url']} for r in standard]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              statuses = dict(pool.map(inspect, [p for p in prs if p['state'] == 'open' and 122 <= p['number'] <= 164 and p['number'] != 150]))
          (out / 'statuses.json').write_text(json.dumps(statuses, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-audit-candidates-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/final-audit/
          if-no-files-found: warn
          retention-days: 7
