name: Prototype Snapshot

on:
  pull_request:
  push:
    branches:
      - codex/compdo-effect-rows-no-elements

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compdo-effect-rows-no-elements
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Inspect regenerated minimal CST
        run: deno run --allow-read experiments/language-cleanup/debug_cst.ts examples/minimal.blot
