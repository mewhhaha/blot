name: Prototype Snapshot

on:
  pull_request:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Apply prototype implementation
        run: |
          if ! grep -q '"compdo"' grammar.baba; then
            cat experiments/language-cleanup/patch.{0,1,2,3} \
              | base64 -d \
              | gzip -d > /tmp/implementation.patch
            patch -p1 < /tmp/implementation.patch
          fi
      - name: Migrate element tests and clean dead element checking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          inference_test = Path("inference.test.ts")
          text = inference_test.read_text()
          text = re.sub(
              r'check\(\n  "an element effect can be stored.*?(?=check\(\n  "a compile-time SIMD)',
              '', text, count=1, flags=re.S,
          )
          text = re.sub(
              r'rejects\(\n  "element property rows reject misspelled fields".*?(?=check\(\n  "effect binding executes)',
              '', text, count=1, flags=re.S,
          )
          marker = '''check(
  "an effect nothing performs stays out of the row",'''
          tests = '''Deno.test("a signature can reuse an effect row tail", async () => {
  const type = await typeOf(`const Console = @effect { .write = Str -> Unit; }
sig logged = (Int -> Int ~ { ..e }) -> Int -> Int ~ { Console, ..e }
let logged = fn f => fn x =>
  <- Console.write "call"
  result <- f x
  return result
return logged
`);
  assertStringIncludes(type, "Console");
});

rejects(
  "an effect row tail must relate two positions",
  `sig quiet = Int -> Int ~ { ..e }
let quiet = fn value => value
return quiet
`,
  "BLOT_EFFECT_ROW_TAIL_UNCONSTRAINED",
);

'''
          if "a signature can reuse an effect row tail" not in text:
              text = text.replace(marker, tests + marker, 1)
          inference_test.write_text(text)

          examples_test = Path("examples.test.ts")
          text = examples_test.read_text()
          text = re.sub(
              r'  "mismatched_element": \{.*?  "unknown_element_property": \{\n    code: "BLOT_ELEMENT_UNKNOWN_PROPERTY",\n    stage: "check",\n  \},\n',
              '', text, count=1, flags=re.S,
          )
          examples_test.write_text(text)

          infer = Path("src/check/infer.ts")
          text = infer.read_text()
          text = text.replace(
              '  /** Property records identified by element desugaring\'s span-preserving shape. */\n  readonly closedRecordArguments: Set<Expr>;\n',
              '',
          )
          text = re.sub(
              r'\n      const elementProperties = elementPropertyApplication\(expr\);.*?\n      \}\n',
              '\n', text, count=1, flags=re.S,
          )
          text = re.sub(
              r'\n      if \(context\.closedRecordArguments\.has\(expr\.arg\)\) \{\n        requireClosedRecord\(expr\.fn, fnType, argType, expr\.arg\.span\);\n      \}',
              '', text, count=1,
          )
          text = re.sub(
              r'\nfunction elementPropertyApplication\(expr: Expr\): Expr \| null \{.*?(?=\nfunction inferSpecial\()',
              '\n', text, count=1, flags=re.S,
          )
          text = text.replace('  const closedRecordArguments = new Set<Expr>();\n', '')
          text = text.replace('    closedRecordArguments,\n', '')
          infer.write_text(text)

          rust = Path("compiler/src/typecheck.rs")
          text = rust.read_text()
          text = re.sub(
              r'\n    closed_record_arguments: RefCell<HashSet<\(String, ExpressionId\)>>,',
              '', text, count=1,
          )
          text = re.sub(
              r'\n            closed_record_arguments: RefCell::new\(HashSet::new\(\)\),',
              '', text, count=1,
          )
          text = re.sub(
              r'\n        self\.closed_record_arguments\n            \.borrow_mut\(\)\n            \.retain\(\|\(path, _\)\| !paths\.contains\(path\)\);',
              '', text, count=1,
          )
          text = re.sub(
              r'\n                if let Expression::Apply \{\n                    argument: properties,.*?\n                \}\n                let \(member_callee, member_arguments\) =',
              '\n                let (member_callee, member_arguments) =',
              text, count=1, flags=re.S,
          )
          text = re.sub(
              r'\n                if self\n                    \.closed_record_arguments.*?\n                \}',
              '', text, count=1, flags=re.S,
          )
          text = re.sub(
              r'\n    fn require_closed_record\(.*?(?=\n    fn constraint_type\()',
              '\n', text, count=1, flags=re.S,
          )
          rust.write_text(text)

          formatter = Path("src/tooling/formatter.ts")
          text = formatter.read_text()
          for item in [
              '  "element_property_expression",\n',
              '  "element_expression",\n',
          ]:
              text = text.replace(item, '')
          text = text.replace(
              '    let valueUsesDelimiters = value.name === "element_expression" ||\n      directRule(value, "element_expression") !== null;\n',
              '    let valueUsesDelimiters = false;\n',
          )
          formatter.write_text(text)

          formatter_test = Path("src/tooling/formatter.test.ts")
          text = formatter_test.read_text()
          text = re.sub(
              r'Deno\.test\("formatting indents suspended element children.*?(?=Deno\.test\("formatting places each long array element)',
              '', text, count=1, flags=re.S,
          )
          formatter_test.write_text(text)
          PY
          rm -f \
            queries/elements.scm \
            examples/rejected/syntax/implicit_element_sequencing.blot \
            examples/rejected/semantics/mismatched_element.blot \
            examples/rejected/semantics/duplicate_element_property.blot \
            examples/rejected/semantics/missing_element_property.blot \
            examples/rejected/semantics/unknown_element_property.blot
      - name: Regenerate parser and compiler schema
        run: |
          deno task generate
          deno task generate:compiler-schema
          deno task inspect
      - run: deno fmt
      - run: cargo fmt --manifest-path compiler/Cargo.toml
      - name: Commit generated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "migrate cleanup corpus and regenerate frontend"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - run: deno check .
      - run: cargo check --manifest-path compiler/Cargo.toml
      - run: tar --exclude=.git -czf /tmp/blot-source.tgz .
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blot-source
          path: /tmp/blot-source.tgz
          if-no-files-found: error
