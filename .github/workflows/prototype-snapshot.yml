name: Prototype Snapshot

on:
  pull_request:
  push:
    branches:
      - codex/compdo-effect-rows-no-elements

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compdo-effect-rows-no-elements
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: extractions/setup-just@v3
      - run: deno task generate:compiler-schema
      - run: cargo fmt --manifest-path compiler/Cargo.toml
      - name: Parse representative modules with repaired compact schema
        run: |
          deno task parse examples/minimal.blot
          deno task parse src/prelude/prelude.blot
      - name: Rebuild checked-in compiler artifact
        run: deno task build:compiler
      - name: Commit regenerated schema and compiler artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compiler/src/schema.rs compiler/src/frontend_plan.rs generated/compiler
          if ! git diff --cached --quiet; then
            git commit -m "align compiler schema with cleanup grammar"
            git push origin HEAD:codex/compdo-effect-rows-no-elements
          fi
      - run: just check
      - run: just test
