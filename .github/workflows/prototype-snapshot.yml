name: Prototype Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -czf /tmp/blot-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: blot-source
          path: /tmp/blot-source.tgz
          if-no-files-found: error
