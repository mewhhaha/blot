name: Prototype Snapshot

on:
  pull_request:
  push:
    branches:
      - codex/compdo-effect-rows-no-elements

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compdo-effect-rows-no-elements
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - run: python3 experiments/language-cleanup/migrate.py
      - name: Drop retired element islands from Baba metadata
        run: >-
          python3 -c 'import json; p="baba.json"; d=json.load(open(p));
          d["gpuFrontend"]["islands"]=[x for x in d["gpuFrontend"]["islands"]
          if not x["rule"].startswith("element_")];
          open(p,"w").write(json.dumps(d,indent=2)+"\n")'
      - name: Regenerate parser and compiler schema
        run: |
          deno task generate
          deno task generate:compiler-schema
          deno task inspect
      - run: deno fmt
      - run: cargo fmt --manifest-path compiler/Cargo.toml
      - name: Commit generated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "migrate cleanup corpus and regenerate frontend"
            git push origin HEAD:codex/compdo-effect-rows-no-elements
          fi
      - run: deno check .
      - run: cargo check --manifest-path compiler/Cargo.toml
      - run: tar --exclude=.git -czf /tmp/blot-source.tgz .
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blot-source
          path: /tmp/blot-source.tgz
          if-no-files-found: error
