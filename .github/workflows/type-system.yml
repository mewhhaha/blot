name: Type-system validation

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'src/prelude/**'
      - 'generated/compiler/prelude.snapshot'
      - '.github/workflows/type-system.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: type-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Prepare reproducible offline compiler inputs
        shell: bash
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/blot-offline"
          mkdir -p "$kit/toolchain" "$kit/vendor"
          cargo vendor --locked --manifest-path compiler/Cargo.toml "$kit/vendor" > "$kit/vendor-config.toml"
          sysroot="$(rustc --print sysroot)"
          cp -a "$sysroot/bin" "$sysroot/lib" "$kit/toolchain/"
          rustc --version > "$kit/rustc-version.txt"
          git rev-parse HEAD > "$kit/commit.txt"
          tar -czf "$RUNNER_TEMP/blot-offline.tar.gz" -C "$kit" .
      - name: Publish offline validation inputs
        uses: actions/upload-artifact@v7
        with:
          name: blot-offline-compiler-${{ github.sha }}
          path: ${{ runner.temp }}/blot-offline.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Rust formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml -- --check
      - name: Native compiler tests
        run: cargo test --locked --manifest-path compiler/Cargo.toml -- --nocapture
      - name: Wasm compiler checks
        run: cargo clippy --locked --manifest-path compiler/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
