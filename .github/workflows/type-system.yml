name: Type-system validation

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'src/prelude/**'
      - 'generated/compiler/prelude.snapshot'
      - 'experiments/compiler-bench/staged-types/**'
      - '.github/workflows/type-system.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: type-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Rust formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml -- --check
      - name: Native compiler tests
        run: cargo test --locked --manifest-path compiler/Cargo.toml -- --nocapture
      - name: Wasm compiler checks
        run: cargo clippy --locked --manifest-path compiler/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
