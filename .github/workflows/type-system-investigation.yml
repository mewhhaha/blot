name: Type system investigation

on:
  push:
    branches:
      - perf/demand-driven-types-20260917

permissions:
  contents: read

jobs:
  validation-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - run: pnpm install --frozen-lockfile
      - name: Prepare offline compiler inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-inputs
          cargo vendor --manifest-path compiler/Cargo.toml validation-inputs/vendor > validation-inputs/cargo-config.toml
          sysroot="$(rustc --print sysroot)"
          mkdir -p validation-inputs/toolchain
          cp -a "$sysroot/bin" "$sysroot/lib" "$sysroot/libexec" validation-inputs/toolchain/
          tar -czf compiler-validation-inputs.tar.gz validation-inputs node_modules .pnp.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-validation-inputs
          path: compiler-validation-inputs.tar.gz
          retention-days: 3
          if-no-files-found: error
