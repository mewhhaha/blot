name: Apply reviewed value-pathology patch

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/value-type-pathologies-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply checksum-bound source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          encoded = ''.join(path.read_text() for path in sorted(pathlib.Path('scripts').glob('value-pathologies.transport.*')))
          raw = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == 'aebac748efda5db088daf69c6c27315a51827d3171ca15a1afec5bef164f0798'
          files = json.loads(raw)
          paths = []
          for item in files:
              path = pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('compiler', 'examples', 'spec', 'src', 'LANGUAGE.md')
              assert not path.is_symlink()
              if item['before'] is None:
                  assert not path.exists(), str(path)
                  text = item['text']
              else:
                  content = path.read_bytes()
                  assert hashlib.sha256(content).hexdigest() == item['before'], str(path)
                  text = content.decode()
                  for start, end, replacement in reversed(item['edits']):
                      text = text[:start] + replacement + text[end:]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
              paths.append(str(path))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['cargo', 'fmt', '--manifest-path', 'compiler/Cargo.toml'], check=True)
          formatted = [p for p in paths if p.endswith(('.ts', '.md', '.json'))]
          subprocess.run(['deno', 'fmt', *formatted], check=True)
          changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only']).decode().splitlines()
          assert set(changed) <= set(paths), changed
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: preserve exact value types and shared graph work; add 56 examples'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/value-type-pathologies-20260907'], check=True)
          PY
      - name: Archive formatted source for reproduction
        run: git archive --format=tar.gz --output=value-pathologies-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: value-pathologies-formatted-source
          path: value-pathologies-source.tar.gz
          if-no-files-found: error
          retention-days: 7
