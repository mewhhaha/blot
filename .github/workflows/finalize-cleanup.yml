name: Finalize Cleanup

on:
  push:
    branches:
      - codex/compdo-effect-rows-no-elements

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compdo-effect-rows-no-elements
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: extractions/setup-just@v3
      - name: Apply final fixes and documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("compiler/src/session.rs")
          text = path.read_text()
          old = "\n".join([
              '        } => serde_json::json!({',
              '            "tag": "arrow",',
              '            "domain": json_value(domain),',
              '            "codomain": json_value(codomain),',
              '            "effects": effects.iter().map(json_value).collect::<Vec<_>>(),',
              '            "effect_tail": effect_tail,',
              '        }),',
          ])
          new = "\n".join([
              '        } => {',
              '            let mut value = serde_json::json!({',
              '                "tag": "arrow",',
              '                "domain": json_value(domain),',
              '                "codomain": json_value(codomain),',
              '                "effects": effects.iter().map(json_value).collect::<Vec<_>>(),',
              '            });',
              '            if let Some(effect_tail) = effect_tail {',
              '                value["effect_tail"] = serde_json::json!(effect_tail);',
              '            }',
              '            value',
              '        },',
          ])
          if old not in text:
              raise SystemExit("arrow JSON block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cat experiments/language-cleanup/final-docs.patch.b64.* \
            | base64 -d \
            | gzip -d > /tmp/final-docs.patch
          patch -p1 < /tmp/final-docs.patch
          rm experiments/language-cleanup/final-docs.patch.b64.*
          rm .github/workflows/finalize-cleanup.yml
      - run: deno fmt
      - run: cargo fmt --manifest-path compiler/Cargo.toml
      - run: just check
      - run: just test
      - name: Commit validated cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "finalize compdo and effect row cleanup"
          git push origin HEAD:codex/compdo-effect-rows-no-elements
