name: Finalize Cleanup

on:
  push:
    branches:
      - codex/compdo-effect-rows-no-elements

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compdo-effect-rows-no-elements
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: extractions/setup-just@v3
      - name: Apply final documentation patch
        run: |
          cat experiments/language-cleanup/final-docs.patch.b64.* \
            | base64 -d \
            | gzip -d > /tmp/final-docs.patch
          patch -p1 < /tmp/final-docs.patch
          rm experiments/language-cleanup/final-docs.patch.b64.*
          rm .github/workflows/finalize-cleanup.yml
      - run: deno fmt
      - run: cargo fmt --manifest-path compiler/Cargo.toml
      - run: just check
      - run: just test
      - name: Commit validated cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "document and validate cleanup surface"
          git push origin HEAD:codex/compdo-effect-rows-no-elements
