name: PR94 merge signature map debug

on:
  push:
    branches:
      - debug/pr94-merge-signature-map

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Instrument closure signature publication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('compiler/src/typecheck.rs')
          source = path.read_text()
          needle = "        let reified_closure_signatures = closure_signatures\n            .iter()\n            .filter_map(|(body, type_)| {\n                self.reify_runtime_type(type_)\n                    .map(|signature| (*body, signature))\n            })\n            .collect::<HashMap<_, _>>();\n"
          replacement = "        for (debug_body, debug_signature) in &closure_signatures {\n            if debug_body.0 == 2837 {\n                eprintln!(\"MERGE_SIGNATURE_TYPE: {debug_signature:#?}\");\n            }\n        }\n        let reified_closure_signatures = closure_signatures\n            .iter()\n            .filter_map(|(body, type_)| {\n                let signature = self.reify_runtime_type(type_);\n                if body.0 == 2837 {\n                    eprintln!(\"MERGE_SIGNATURE_REIFIED: {}\", signature.is_some());\n                }\n                signature.map(|signature| (*body, signature))\n            })\n            .collect::<HashMap<_, _>>();\n"
          if source.count(needle) != 1:
              raise SystemExit(f'expected closure publication site once, found {source.count(needle)}')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          cargo fmt --manifest-path compiler/Cargo.toml
      - name: Run first regression
        run: cargo test --manifest-path compiler/Cargo.toml an_empty_scratch_argument_uses_the_contextual_result_representation -- --nocapture --test-threads=1
