name: do-blocks-plan-debug

on:
  push:
    branches:
      - agent/do-blocks-ci

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Isolate prelude parser regression
        run: |
          cat > scripts/_debug_do_plan.ts <<'TS'
          import { parseConcrete } from "../src/syntax/parse.ts";
          const source = await Deno.readTextFile("src/prelude/prelude.blot");
          async function check(label: string, text: string) {
            const result = await parseConcrete(text);
            console.log(label, result.ok ? "OK" : JSON.stringify(result.diagnostics));
          }
          const anchors = [
            "const sort_by =",
            "const range =",
            "const pow2 =",
            "const Int =",
            "const F64 =",
            "const likely =",
            "const integer_width =",
            "const U =",
          ];
          for (const anchor of anchors) {
            const cut = source.indexOf(anchor);
            if (cut < 0) throw new Error(`missing ${anchor}`);
            await check(`prefix before ${anchor}`, source.slice(0, cut) + "\nreturn ()\n");
          }
          const pow2 = `const pow2 =\n  rec (fn n =>\n    if is_less (@int.cmp n 1):\n      return 1\n    else:\n      return 2 * pow2 (@int.sub n 1)\n  )\n`;
          await check("pow2 only", pow2 + "return pow2\n");
          await check("pow2 then const", pow2 + "const Int = @type.int\nreturn Int\n");
          await check("pow2 many consts", pow2 + `const Int = @type.int\nconst Str = @type.text\nconst F64 = @type.float\nconst likely = fn condition => @branch.likely condition\nreturn likely\n`);
          TS
          deno run --allow-read scripts/_debug_do_plan.ts
