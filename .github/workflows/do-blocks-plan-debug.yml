name: do-blocks-plan-debug

on:
  push:
    branches:
      - agent/do-blocks-ci

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Reduce case arm parser regression
        run: |
          cat > scripts/_debug_do_plan.ts <<'TS'
          import { parseConcrete } from "../src/syntax/parse.ts";
          async function check(label: string, body: string) {
            const result = await parseConcrete(`${body}\nreturn ()\n`);
            console.log(label, result.ok ? "OK" : JSON.stringify(result.diagnostics));
          }
          await check("exact", `const integer_width = fn bits => case is_greater (@int.cmp bits 0) of\n  #True => bits\n  #False =>\n    @fail (Text.append "integer bit width must be positive, found " (Text.of_int bits))`);
          await check("short multiline", `const f = fn bits => case bits of\n  #True => bits\n  #False =>\n    @fail bits`);
          await check("short inline", `const f = fn bits => case bits of\n  #True => bits\n  #False => @fail bits`);
          await check("case no lambda", `const f = case x of\n  #True => x\n  #False =>\n    @fail x`);
          await check("case multiline literal", `const f = fn x => case x of\n  #True => x\n  #False =>\n    1`);
          await check("case parenthesized app", `const f = fn x => case x of\n  #True => x\n  #False =>\n    g (h x)`);
          await check("indented non-case", `const f = fn x =>\n  g (h x)`);
          TS
          deno run --allow-read scripts/_debug_do_plan.ts
