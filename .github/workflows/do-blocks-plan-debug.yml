name: do-blocks-plan-debug

on:
  push:
    branches:
      - agent/do-blocks-ci

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: do-blocks
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Locate former parenthesized suites
        run: |
          cat > scripts/_debug_do_plan.ts <<'TS'
          import { createParserAsync, type Token } from "../generated/wasm/mod.ts";
          const lexer = await createParserAsync({
            url: new URL("../generated/wasm/parser.wasm", import.meta.url),
            planUrl: new URL("../generated/wasm/parser.plan", import.meta.url),
          });

          function oldSuite(previous: Token, first: Token, second: Token | undefined): boolean {
            if (previous.type !== "literal" || previous.literal !== "(") return false;
            if (first.type === "literal") {
              return first.literal === "<-" || first.literal === "let" || first.literal === "const" ||
                first.literal === "sig" || first.literal === "return" || first.literal === "for" ||
                first.literal === "break" || first.literal === "open";
            }
            if (first.type !== "named" || second?.type !== "literal") return false;
            if (first.kind !== "IDENT" && first.kind !== "TYPE_IDENT") return false;
            return second.literal === "<-" || second.literal === ":=";
          }

          const command = new Deno.Command("git", { args: ["ls-files", "*.blot"], stdout: "piped" });
          const files = new TextDecoder().decode((await command.output()).stdout).trim().split("\n").filter(Boolean);
          let count = 0;
          for (const path of files) {
            const source = await Deno.readTextFile(path);
            const lexed = lexer.lex(source, { preserveTrivia: true });
            const tokens: Token[] = [];
            for (let i = 0; i < lexed.tokenTape.length; i++) {
              const t = lexed.tokenTape.token(i);
              if (t?.channel === "main" && t.type !== "eof") tokens.push(t);
            }
            for (let i = 1; i < tokens.length; i++) {
              const previous = tokens[i - 1]!;
              const first = tokens[i]!;
              const gap = source.slice(previous.span.end, first.span.start);
              if (!/[\r\n]/.test(gap) || !oldSuite(previous, first, tokens[i + 1])) continue;
              const before = source.slice(0, previous.span.start);
              const line = before.split("\n").length;
              console.log(`${path}:${line}: ${JSON.stringify(source.slice(previous.span.start, Math.min(source.length, first.span.end + 80)))}`);
              count++;
            }
          }
          console.log("former parenthesized suite count", count);
          TS
          deno run --allow-read --allow-run=git scripts/_debug_do_plan.ts
