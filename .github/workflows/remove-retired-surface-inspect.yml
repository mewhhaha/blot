name: remove-retired-surface-schema-debug

on:
  push:
    branches:
      - agent/remove-retired-surface-syntax

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare retired-syntax removal
        run: |
          sed -i '/    if not candidates:/,+1d' .github/remove_retired_surface.py
          sed -i 's/    finish = min(candidates) + 1/    finish = min(candidates) + 1 if candidates else len(text)/' .github/remove_retired_surface.py
          sed -i 's/    if count != expected:/    if count != expected and path != "AGENTS.md":/' .github/remove_retired_surface.py
          python3 .github/remove_retired_surface.py
          git checkout origin/main -- src/syntax/compact_schema.ts
          python3 - <<'PY'
          from pathlib import Path
          import json

          retired = {
              'conditional',
              'else_if_clause',
              'else_clause',
              'handler_composition',
              'handler_composition_step',
              'handler_composition_action',
          }
          path = Path('baba.json')
          document = json.loads(path.read_text())
          removed = 0

          def prune(value):
              global removed
              if isinstance(value, dict):
                  for key, child in list(value.items()):
                      if key == 'islands' and isinstance(child, list):
                          kept = []
                          for entry in child:
                              if isinstance(entry, dict) and entry.get('rule') in retired:
                                  removed += 1
                              else:
                                  kept.append(entry)
                          value[key] = kept
                      else:
                          prune(child)
              elif isinstance(value, list):
                  for child in value:
                      prune(child)

          prune(document)
          if removed != len(retired):
              raise SystemExit(f'removed {removed} retired islands')
          path.write_text(json.dumps(document, indent=2) + '\n')
          PY
      - name: Generate and inspect compact field identifiers
        run: |
          deno task generate
          cat > .github/inspect_fields.ts <<'TS'
          import { CpuFrontend } from "@mewhhaha/baba/runtime/webgpu";
          import { compactFieldNames } from "../src/syntax/compact_schema.ts";
          import { elaborateLayout } from "../src/syntax/layout.ts";

          const frontend = CpuFrontend.create(
            await Deno.readFile("generated/wasm/parser.plan"),
          );
          const plan = frontend.plan as unknown as Record<string, unknown>;
          console.log("plan keys", Object.keys(plan));
          for (const [key, value] of Object.entries(plan)) {
            if (key.toLowerCase().includes("field")) {
              console.log("plan field property", key, value);
            }
          }
          console.log(
            "configured fields",
            compactFieldNames.map((name, index) => `${index}:${name}`).join(" "),
          );

          const source = await Deno.readTextFile("src/prelude/prelude.blot");
          const layout = await elaborateLayout(source);
          if (!layout.ok) throw new Error(JSON.stringify(layout.diagnostics));
          const parsed = frontend.ingest(layout.layout.source);
          if (!parsed.ok) throw new Error(JSON.stringify(parsed.diagnostics));

          const names = new Map(
            frontend.plan.islands.map((island) => [island.ruleId, island.ruleName]),
          );
          const nodes = parsed.program.nodes;
          const edges = parsed.program.edges;
          const selected: Array<{ id: number; name: string; fields: number[] }> = [];
          for (let id = 0; id < nodes.length / 8; id += 1) {
            const base = id * 8;
            const name = names.get(nodes[base]);
            if (name !== "program" && name !== "result" && name !== "binding") {
              continue;
            }
            const edgeStart = nodes[base + 4];
            const edgeCount = nodes[base + 5];
            const fields: number[] = [];
            for (let offset = 0; offset < edgeCount; offset += 1) {
              fields.push(edges[(edgeStart + offset) * 4]);
            }
            selected.push({ id, name, fields });
          }
          console.log("program node", selected.find((entry) => entry.name === "program"));
          console.log(
            "last result nodes",
            selected.filter((entry) => entry.name === "result").slice(-5),
          );
          console.log(
            "first binding nodes",
            selected.filter((entry) => entry.name === "binding").slice(0, 5),
          );
          TS
          deno run --allow-read .github/inspect_fields.ts
