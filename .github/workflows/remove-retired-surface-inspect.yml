name: remove-retired-surface-cleanup

on:
  push:
    branches:
      - agent/remove-retired-surface-syntax

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare Rust target
        run: rustup target add wasm32-unknown-unknown
      - name: Remove retired production syntax
        run: |
          sed -i '/    if not candidates:/,+1d' .github/remove_retired_surface.py
          sed -i 's/    finish = min(candidates) + 1/    finish = min(candidates) + 1 if candidates else len(text)/' .github/remove_retired_surface.py
          sed -i 's/    if count != expected:/    if count != expected and path != "AGENTS.md":/' .github/remove_retired_surface.py
          python3 .github/remove_retired_surface.py
          git checkout origin/main -- src/syntax/compact_schema.ts
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          text = path.read_text()
          start = text.index('`try program with ... end`')
          marker = 'Nothing downstream of the parser knows these forms exist.'
          end = text.index(marker, start) + len(marker)
          replacement = (
              'Two-argument `@handle` calls become nullary computation '
              'transformers containing ordinary three-argument calls. '
              'Nothing downstream of surface elaboration knows that source '
              'convenience exists.'
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json

          retired = {
              'conditional',
              'else_if_clause',
              'else_clause',
              'handler_composition',
              'handler_composition_step',
              'handler_composition_action',
          }
          path = Path('baba.json')
          document = json.loads(path.read_text())
          removed = 0

          def prune(value):
              global removed
              if isinstance(value, dict):
                  for key, child in list(value.items()):
                      if key == 'islands' and isinstance(child, list):
                          kept = []
                          for entry in child:
                              if isinstance(entry, dict) and entry.get('rule') in retired:
                                  removed += 1
                              else:
                                  kept.append(entry)
                          value[key] = kept
                      else:
                          prune(child)
              elif isinstance(value, list):
                  for child in value:
                      prune(child)

          prune(document)
          if removed != len(retired):
              raise SystemExit(
                  f'expected to remove {len(retired)} retired islands, removed {removed}'
              )
          path.write_text(json.dumps(document, indent=2) + '\n')
          PY
      - name: Regenerate frontend and compiler artifacts
        run: |
          deno task generate
          deno task generate:rust-middle-schema
          deno task build:rust-middle
          deno task inspect > /tmp/blot-plan.json
          cat /tmp/blot-plan.json
      - name: Record frontend counters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          inspection = json.loads(Path('/tmp/blot-plan.json').read_text())
          path = Path('docs/gpu-profile.md')
          text = path.read_text()

          keys = [
              'lexerStates',
              'maxCandidateMultiplicity',
              'islandCount',
              'islandStates',
              'islandTransitions',
              'contractionRounds',
              'denseTransitionBytes',
              'packedBytes',
              'rootLoopIsland',
              'parallelLongRegionIslands',
          ]

          def display(key, value):
              if key == 'parallelLongRegionIslands' and isinstance(value, list):
                  return str(len(value))
              if key == 'rootLoopIsland' and isinstance(value, dict):
                  identifier = value.get('id', value.get('island', value.get('index')))
                  name = value.get('name', value.get('rule', value.get('ruleName')))
                  if identifier is not None and name is not None:
                      return f'{identifier} (`{name}`)'
              if isinstance(value, (dict, list)):
                  return json.dumps(value, separators=(',', ':'))
              return f'{value:,}' if isinstance(value, int) else str(value)

          for key in keys:
              if key not in inspection:
                  raise SystemExit(f'inspection omitted {key}: {sorted(inspection)}')
              value = display(key, inspection[key])
              pattern = re.compile(rf'^(\| `{re.escape(key)}`\s*\|)\s*[^|]*\|', re.M)
              text, count = pattern.subn(
                  lambda match: f'{match.group(1)} {value:>18} |',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'docs/gpu-profile.md has no row for {key}')

          path.write_text(text)
          PY
      - name: Format and validate
        run: |
          deno fmt
          git diff --check
          if ! command -v just >/dev/null 2>&1; then
            cargo install just --locked
          fi
          just check
          just test
      - name: Verify retired production forms are gone
        run: |
          ! grep -R -n -E 'BLOT_VALUE_IF_REMOVED|BLOT_TRY_REMOVED|handler_composition|isValueConditional|discarded-value-if|discardedValueIf' \
            --exclude-dir=.git --exclude-dir=migration --exclude-dir=generated \
            --exclude='compiler.wasm' --exclude='lower.ts' \
            grammar.baba baba.json queries src experiments/rust-middle
          grep -q 'handler_composition' migration/layout-v1/grammar.baba
      - name: Commit cleanup
        run: |
          rm .github/remove_retired_surface.py
          rm .github/workflows/remove-retired-surface-inspect.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft origin/main
          git commit -m 'Remove retired surface syntax'
          git push --force-with-lease origin HEAD:agent/remove-retired-surface-syntax
