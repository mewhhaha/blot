name: Apply stable rebinding fix

on:
  push:
    branches:
      - fix/stable-rebinding-union-context

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-rebinding-union-context
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply source, test, and documentation changes
        run: python .github/apply-stable-rebinding-fix.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml -- --check

      - name: Test Rust compiler
        run: cargo test --manifest-path compiler/Cargo.toml

      - name: Commit the fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/apply-stable-rebinding-fix.py
          rm .github/workflows/apply-stable-rebinding-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Infer stable rebindings against their existing type"
          git push origin HEAD:fix/stable-rebinding-union-context
