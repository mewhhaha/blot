name: Apply stable rebinding fix

on:
  push:
    branches:
      - fix/stable-rebinding-union-context

concurrency:
  group: stable-rebinding-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-rebinding-union-context
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply source, test, and documentation changes
        run: python .github/apply-stable-rebinding-fix.py

      - name: Check Rust formatting
        run: cargo fmt --manifest-path compiler/Cargo.toml -- --check

      - name: Probe stable variant rebinding
        run: >-
          cargo test --manifest-path compiler/Cargo.toml
          session::tests::stable_rebinding_preserves_a_declared_variant_inside_a_loop
          -- --exact --nocapture
