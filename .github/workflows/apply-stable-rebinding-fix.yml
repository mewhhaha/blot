name: Apply stable rebinding fix

on:
  push:
    branches:
      - fix/stable-rebinding-union-context

concurrency:
  group: stable-rebinding-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-rebinding-union-context
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply source, test, and documentation changes
        run: python .github/apply-stable-rebinding-fix.py

      - name: Format Rust
        run: cargo fmt --manifest-path compiler/Cargo.toml

      - name: Probe stable variant rebinding
        run: >-
          cargo test --manifest-path compiler/Cargo.toml
          session::tests::stable_rebinding_preserves_a_declared_variant_inside_a_loop
          -- --exact --nocapture

      - name: Archive patched source
        if: always()
        shell: bash
        run: |
          git ls-files -z | tar --null --files-from=- --create --gzip --file=/tmp/blot-source.tgz

      - name: Upload patched source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blot-patched-source
          path: /tmp/blot-source.tgz
          retention-days: 1
