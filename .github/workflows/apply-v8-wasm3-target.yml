          runtime_profile = r'''
## WebAssembly target profile

The production default emits standard WebAssembly 3.0 instructions and is
continuously exercised on V8. The public ABI remains memory32; adopting the
Wasm 3.0 specification does not silently change pointer width, canonical
layouts, or caller ownership.

Every manifest declares:

```text
coreSpecification = "3.0"
requiredFeatures   = sorted exact feature names used by this artifact
```

The current emitter may require `bulk-memory`, `multi-value`, fixed-width `simd`,
and `tail-call`. A host must validate the complete module and may use the feature
list for an earlier compatibility diagnostic. The feature list is descriptive;
it never substitutes for WebAssembly validation.

An internal direct call in exact tail position lowers to `return_call` when the
callee and caller have the same flattened result layout. This preserves source
returns, requests, traps, and divergence while discarding a target-only caller
frame. Public wrappers retain ordinary calls because canonical lifting,
lowering, call checkpoints, and post-return ownership must still execute.

A newer WebAssembly feature is enabled only when it either removes a compiler
transformation or has measured benefit and its source semantics are explicit.
Memory64, multiple memories, GC, typed function references, exception handling,
and relaxed SIMD are not baseline assumptions merely because V8 implements
them. Their admission requires a representation, determinism, ABI, ownership,
and fallback account.

The operational feature audit and engine matrix are recorded in
[`docs/wasm-target-profile.md`](../docs/wasm-target-profile.md).

'''
