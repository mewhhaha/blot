        shell: bash
        run: |
          cargo fmt --manifest-path compiler/Cargo.toml
          deno fmt \
            .github/workflows/ci.yml \
            docs/abi.md \
            docs/backend.md \
            docs/wasm-target-profile.md \
            package.json \
            spec/README.md \
            spec/RUNTIME.md \
            src/node/v8_wasm.test.ts

      - name: Compile backend tests
        run: cargo test --manifest-path compiler/Cargo.toml backend::tests

      - name: Commit reviewed changes
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/backend.rs src/node/v8_wasm.test.ts package.json \
            .github/workflows/ci.yml docs/abi.md docs/backend.md \
            docs/wasm-target-profile.md spec/README.md spec/RUNTIME.md
          git commit -m "Target V8 with the WebAssembly 3 profile"
          git push origin HEAD:codex/v8-wasm3-target
