          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {count}: {old[:120]!r}"
                  )
              file.write_text(text.replace(old, new))

          backend = Path("compiler/src/backend.rs")
          if 'core_specification: "3.0"' in backend.read_text():
              raise SystemExit("V8/Wasm 3 patch is already present")

