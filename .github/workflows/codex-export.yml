name: Validate source-defined operator fix

on:
  pull_request:
    branches:
      - main

concurrency:
  group: validate-source-defined-operators-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'codex/source-defined-operators'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/source-defined-operators
          fetch-depth: 0
      - name: Apply candidate fix
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/codex-source-fixity.patch
          git apply .github/codex-sum-retag.patch
          rm .github/codex-source-fixity.patch
          rm .github/codex-sum-retag.patch
          rm .github/workflows/codex-export.yml
          git diff --check
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Format candidate and accepted source corpus
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path compiler/Cargo.toml
          deno fmt src/syntax/lower.ts src/syntax/module.test.ts
          cat > .codex-format-corpus.ts <<'TS'
          import { formatSource } from "./src/tooling/formatter.ts";

          const pendingDirectories = ["examples", "src/prelude", "case-studies"];
          const sources: string[] = [];
          while (pendingDirectories.length > 0) {
            const directory = pendingDirectories.pop();
            if (directory === undefined) break;
            for await (const entry of Deno.readDir(directory)) {
              const path = `${directory}/${entry.name}`;
              if (entry.isDirectory) {
                if (path !== "examples/rejected") pendingDirectories.push(path);
                continue;
              }
              if (entry.isFile && path.endsWith(".blot")) sources.push(path);
            }
          }

          for (const path of sources.sort()) {
            const source = await Deno.readTextFile(path);
            const formatted = await formatSource(source);
            if (!formatted.ok) {
              const codes = formatted.diagnostics.map((diagnostic) => diagnostic.code);
              throw new Error(`${path} did not format: ${codes.join(", ")}`);
            }
            if (formatted.source !== source) {
              await Deno.writeTextFile(path, formatted.source);
            }
          }
          TS
          deno run --allow-read --allow-write .codex-format-corpus.ts
          rm .codex-format-corpus.ts
      - name: Rebuild compiler and prelude snapshot
        run: >-
          deno run
          --allow-read
          --allow-write
          --allow-run=cargo,git,rustc
          --allow-env
          scripts/build_compiler.ts
      - name: Regenerate language health
        run: pnpm generate:health
      - name: Check generated artifacts
        run: deno task check:generated
      - name: Check Rust formatting and lint
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path compiler/Cargo.toml -- --check
          cargo clippy \
            --manifest-path compiler/Cargo.toml \
            --target wasm32-unknown-unknown \
            -- -D warnings
      - name: Test Rust compiler
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path compiler/Cargo.toml -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
      - name: Check TypeScript, formatting, and lint
        shell: bash
        run: |
          set -euo pipefail
          deno check .
          deno fmt --check
          deno lint
      - name: Check implementation manifest
        run: pnpm current:check
      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          pnpm test
          pnpm run check
          pnpm run smoke
      - name: Commit validated source and snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix residual sum coercion and format source corpus"
          git push origin HEAD:codex/source-defined-operators
      - name: Pack validated workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/blot-workspace.tar.gz" .
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-source-defined-operators-validation
          path: |
            ${{ runner.temp }}/cargo-test.log
            ${{ runner.temp }}/blot-workspace.tar.gz
          if-no-files-found: warn
          retention-days: 1
