name: Apply CI backend fix

on:
  push:
    branches:
      - codex/source-defined-operators

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply backend fix and publish clean commit
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/codex-ci-green.patch
          rm .github/codex-ci-green.patch
          rm .github/workflows/codex-ci-green.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix static product field layout"
          git push origin HEAD:codex/source-defined-operators
