name: CI Debug

on:
  pull_request:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply source-region patch
        shell: bash
        run: |
          git pull --rebase origin "${{ github.head_ref }}"
          python3 experiments/owned-regions/patch_source.py
          deno fmt \
            src/check/type.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/check/bridge.ts \
            src/check/primitives.ts \
            src/comptime/value.ts \
            src/comptime/primitives.ts \
            src/comptime/eval.ts \
            src/linear/check.ts \
            experiments/owned-regions/source_surface.test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/check/type.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/check/bridge.ts \
            src/check/primitives.ts \
            src/comptime/value.ts \
            src/comptime/primitives.ts \
            src/comptime/eval.ts \
            src/linear/check.ts \
            experiments/owned-regions/source_surface.test.ts
          git commit -m 'feat: add scoped owned-region source primitives'
          git push origin HEAD:"${{ github.head_ref }}"
      - name: Check TypeScript region surface
        run: |
          deno check \
            src/check/type.ts \
            src/check/constrain.ts \
            src/check/print.ts \
            src/check/bridge.ts \
            src/check/primitives.ts \
            src/comptime/value.ts \
            src/comptime/primitives.ts \
            src/comptime/eval.ts \
            src/linear/check.ts
          deno test experiments/owned-regions/source_surface.test.ts
