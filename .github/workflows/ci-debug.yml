name: CI Debug

on:
  pull_request:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: extractions/setup-just@v3
      - name: Run gates and record result
        shell: bash
        run: |
          set +e
          just check > check.log 2>&1
          check_status=$?
          just test > test.log 2>&1
          test_status=$?
          rm -f ci-pass ci-fail
          if [ "$check_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            printf 'just check: PASS\njust test: PASS\n' > ci-pass
          else
            {
              printf 'just check: %s\n' "$([ "$check_status" -eq 0 ] && echo PASS || echo FAIL)"
              printf 'just test: %s\n\n' "$([ "$test_status" -eq 0 ] && echo PASS || echo FAIL)"
              if [ "$check_status" -ne 0 ]; then
                echo '--- just check tail ---'
                tail -n 160 check.log
              fi
              if [ "$test_status" -ne 0 ]; then
                echo
                echo '--- just test tail ---'
                tail -n 160 test.log
              fi
            } > ci-fail
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-pass ci-fail
          git commit -m 'ci: record debug result [skip ci]' || true
          git push origin HEAD:${{ github.head_ref }}
          if [ "$check_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi
