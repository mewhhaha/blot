name: CI Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Probe Store provenance
        run: deno test --allow-read --allow-write experiments/owned-regions/store_provenance.test.ts
