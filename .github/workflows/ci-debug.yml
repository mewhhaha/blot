name: CI Debug

on:
  pull_request:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: extractions/setup-just@v3
      - name: Format owned-region draft
        shell: bash
        run: |
          deno fmt \
            spec/OWNED_REGIONS.md \
            src/linear/region_certificate.ts \
            src/linear/region_family.ts \
            src/linear/region_interval.ts \
            experiments/owned-regions
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            spec/OWNED_REGIONS.md \
            src/linear/region_certificate.ts \
            src/linear/region_family.ts \
            src/linear/region_interval.ts \
            experiments/owned-regions
          git commit -m 'fmt: normalize owned-region draft [skip ci]' || true
          git push origin HEAD:${{ github.head_ref }}
      - name: Check owned-region experiment
        shell: bash
        run: |
          deno check \
            src/linear/region_certificate.ts \
            src/linear/region_family.ts \
            src/linear/region_interval.ts \
            experiments/owned-regions/*.ts
          deno lint \
            src/linear/region_certificate.ts \
            src/linear/region_family.ts \
            src/linear/region_interval.ts \
            experiments/owned-regions
          deno test experiments/owned-regions/*.test.ts
