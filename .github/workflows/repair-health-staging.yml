name: Repair main health staging

on:
  pull_request:
    paths:
      - .github/workflows/repair-health-staging.yml

permissions:
  contents: read

jobs:
  regenerate:
    if: github.repository == 'mewhhaha/blot' && github.event.pull_request.head.repo.full_name == 'mewhhaha/blot' && github.event.pull_request.head.ref == 'repair/pr143-compiler-workbench-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1dac7c9b7c1a437b1baec4786b272a31c1d863f4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and verify the exact main inventory
        run: |
          set -euo pipefail
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          deno run --allow-read scripts/generate_language_health.ts --check
          deno fmt --check
          git diff --check
          test "$(git diff --name-only)" = generated/language-health.json
          git config user.name 'Blot compiler repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/language-health.json
          git commit -m 'chore: refresh language health after shared effect implementation'
          git push origin HEAD:refs/heads/repair/main-health-staged-20260915
          git rev-parse HEAD
