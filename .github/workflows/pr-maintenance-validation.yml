name: PR maintenance validation
on:
  push:
    branches:
      - maintenance/pr-105-106-validation-20260906
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 27241dee329a5e12cda5a7fa7a0d998c6271d18d
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Reproduce the locally reviewed integration tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/codex/review-implementation-20260906)" = 27241dee329a5e12cda5a7fa7a0d998c6271d18d
          test "$(git rev-parse origin/main)" = 2ce7c417a6f3fa8c953054f4bdfb13dcba5dcd8b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit 2ce7c417a6f3fa8c953054f4bdfb13dcba5dcd8b
          deno run --allow-read --allow-write scripts/generate_language_health.ts
          deno fmt
          git diff --check
          git add -u
          test "$(git write-tree)" = 782ba824b1ee77e847a4ae958226e3ce938252b2
          git commit -m 'Merge main and repair integration formatting and generated diagnostics' -m 'Preserve the latest asynchronous-capability refusal fix. Apply repository formatting and regenerate the diagnostic catalog; no semantic checks or CI gates are weakened.'
      - name: Build frozen integration compiler
        run: pnpm compiler:build
      - name: Verify source and prelude did not change during compilation
        run: git diff --exit-code
      - name: Validate Rust formatting and lint
        run: |
          cargo fmt --manifest-path compiler/Cargo.toml --check
          cargo clippy --manifest-path compiler/Cargo.toml --all-targets -- -D warnings
      - name: Test backend regressions and predicate safety
        run: |
          cargo test --manifest-path compiler/Cargo.toml backend::
          cargo test --manifest-path compiler/Cargo.toml predicate_summary
      - name: Check repository types, formatting, lint, and generated metadata
        run: |
          deno check .
          deno fmt --check
          deno lint
          pnpm current:check
          pnpm health
      - name: Qualify abstraction and host contracts
        run: node scripts/check_abstractions.mjs
      - name: Test performance regressions and execution conformance
        run: |
          node --import tsx --test src/node/performance_pathologies.test.ts src/node/v8_target.test.ts
          node --import ./src/node/deno_test_compat.mjs --import tsx --test src/compiler/performance_gate.test.ts
          deno run --allow-read scripts/verify_runtime.ts
      - name: Verify distributable package
        run: pnpm package:check
      - name: Publish only if both reviewed branches are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD^{tree})" = 782ba824b1ee77e847a4ae958226e3ce938252b2
          git fetch origin main codex/review-implementation-20260906
          test "$(git rev-parse origin/codex/review-implementation-20260906)" = 27241dee329a5e12cda5a7fa7a0d998c6271d18d
          test "$(git rev-parse origin/main)" = 2ce7c417a6f3fa8c953054f4bdfb13dcba5dcd8b
          git push origin HEAD:refs/heads/codex/review-implementation-20260906
      - name: Package exact integration evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > VALIDATION_COMMIT
          git rev-parse HEAD^{tree} > VALIDATION_TREE
          git bundle create integration.bundle HEAD
          {
            git ls-files -z
            printf 'generated/compiler/compiler.wasm\0'
            printf 'generated/compiler/compiler-artifact.json\0'
            printf '.pnp.cjs\0'
            printf 'node_modules\0'
            printf 'integration.bundle\0'
            printf 'VALIDATION_COMMIT\0'
            printf 'VALIDATION_TREE\0'
          } > "$RUNNER_TEMP/integration.files"
          tar --create --gzip --file=pr106-integration.tar.gz --null --files-from="$RUNNER_TEMP/integration.files"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr106-integration
          path: pr106-integration.tar.gz
          if-no-files-found: error
          retention-days: 3
