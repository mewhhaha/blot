[package]
name = "blot-staged-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "staged-prototype"
path = "src/main.rs"
test = false

[dependencies]
num-bigint = { version = "=0.4.6", features = ["serde"] }
num-traits = "=0.2.19"
serde = { version = "=1.0.219", features = ["derive", "rc"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
wasm-encoder = "=0.255.0"
wasmparser = { version = "=0.255.0", default-features = false, features = ["simd", "validate"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
